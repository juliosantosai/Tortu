<!--
Archivo: layers/ganador.html
Propósito: corona del equipo líder (sobre el escudo de CERRO, como en el modelo) y banner de
ganador oculto por defecto (se muestra añadiendo la clase .is-visible desde la lógica futura).
Debe respetar:
- aparecer como capa final encima de todo
- no desviar la atención de la pista en modo normal
- solo JS mínimo: la corona sigue al líder y el banner aparece cuando hay ganador
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif;
      font-weight: 900;
    }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board {
      position: absolute;
      left: 0;
      top: 0;
      width: 316px;
      height: 562px;
      transform: scale(3.417722);
      transform-origin: 0 0;
    }

    .crown { position: absolute; left: 247px; top: -4px; width: 46px; height: 33px; transform: rotate(-10deg); filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); transition: left .7s cubic-bezier(.3,1.4,.5,1), opacity .4s; }
    .banner {
      position: absolute; left: 38px; top: 250px; width: 240px; height: 64px; box-sizing: border-box;
      border: 3px solid #f2c230; border-radius: 12px; background: linear-gradient(180deg, #3a2208, #1b1004);
      box-shadow: 0 4px 14px rgba(0,0,0,.6), inset 0 0 10px rgba(242,194,48,.3);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .3s;
    }
    .banner.is-visible { opacity: 1; }
    .banner .title { margin: 0; color: #f7c948; font-size: 10px; letter-spacing: 2px; }
    .banner .name { margin: 2px 0 0; color: #fff; font-size: 18px; letter-spacing: 1px; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <div class="board">
    <svg class="crown" viewBox="0 0 44 33">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e6a817"/></linearGradient></defs>
      <path d="M3 29 1 10l11 8L22 3l10 15 11-8-2 19Z" fill="url(#g)" stroke="#b9770e" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="3" y="24" width="38" height="5.5" rx="1.5" fill="#f2b92b" stroke="#b9770e" stroke-width=".8"/>
      <circle cx="22" cy="3.5" r="2.6" fill="#ef4444"/><circle cx="1.8" cy="9.5" r="2.4" fill="#ec4899"/><circle cx="42.2" cy="9.5" r="2.4" fill="#ec4899"/>
      <circle cx="11" cy="27" r="1.6" fill="#ef4444"/><circle cx="22" cy="27" r="1.6" fill="#22d3ee"/><circle cx="33" cy="27" r="1.6" fill="#22c55e"/>
    </svg>
    <div class="banner" id="winner-banner">
      <p class="title">WINNER</p>
      <p class="name" id="winner-name">OLIMPIA</p>
    </div>
  </div>
  <script src="/layers/game-core.js"></script>
  <script>
    (function () {
      var crown = document.querySelector('.crown'), banner = document.getElementById('winner-banner'), nameEl = document.getElementById('winner-name');
      TortuGame.onState(function (st) {
        var a = st.teams[0].p, b = st.teams[1].p;
        crown.style.opacity = a === b ? 0 : 1;
        crown.style.left = (a > b ? 19 : 247) + 'px';
        if (st.winner > -1) nameEl.textContent = st.teams[st.winner].name;
        banner.classList.toggle('is-visible', st.winner > -1);
      });
    })();
  </script>
</body>
</html>
