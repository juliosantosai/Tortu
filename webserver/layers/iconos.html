<!--
Archivo: layers/iconos.html
Propósito: insignia VS entre los dos carriles.
Debe respetar:
- ser decorativa y ligera
- no reemplazar a alertas ni a la barra de progreso
- mantenerse visualmente clara y no invasiva
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif;
      font-weight: 900;
    }
    /* Alargue de la pista: index.html fija --ext (px de tablero) según las partes ocultas. */
    @property --ext { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --hdr { syntax: '<length>'; inherits: true; initial-value: 0px; }
    :root { transition: --ext .35s ease, --hdr .35s ease; }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board {
      position: absolute;
      left: 0;
      top: 0;
      width: 316px;
      height: 562px;
      transform: scale(3.417722);
      transform-origin: 0 0;
    }

    .vs {
      position: absolute; left: 150px; top: calc(218px - var(--ext) * .8); width: 16px; height: 16px; box-sizing: border-box;
      border-radius: 50%; border: 1.5px solid #3b2a15; background: radial-gradient(circle at 40% 35%, #fff7e0, #e6d4a8);
      display: flex; align-items: center; justify-content: center;
      color: #3b2a15; font-size: 5.5px; box-shadow: 0 1px 2px rgba(0,0,0,.55);
    }
  </style>
</head>
<body>
  <div class="board">
    <div class="vs">VS</div>
  </div>
</body>
</html>
