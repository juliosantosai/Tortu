<!--
Archivo: layers/bandera-1.html
Propósito: escudo/bandera, placa con el nombre del equipo 1 (OLIMPIA) y COPAS ganadas.
Gamificado: marco metálico con brillo, placa tipo HUD de videojuego, trofeo con contador
de copas (se anima y lanza confeti al ganar una).
Debe respetar:
- ser clara y legible
- mantenerse en el encabezado de la tarjeta del equipo 1
- compartir el mismo estilo visual que la bandera del equipo 2
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif; font-weight: 900;
    }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board { position: absolute; left: 0; top: 0; width: 316px; height: 562px; transform: scale(3.417722); transform-origin: 0 0; }
    .board { --ac: #e2e8f0; --ac2: #94a3b8; --glow: rgba(226,232,240,.55); --dk: #0f172a; }

    /* Escudo con marco metálico y destello que lo barre. */
    .crest-wrap { position: absolute; left: 16px; top: 15px; width: 56px; height: 45px; animation: float 3.6s ease-in-out infinite; }
    .crest-wrap::before { content: ''; position: absolute; inset: -4px; border-radius: 9px; background: radial-gradient(closest-side, var(--glow), transparent 72%); animation: pulse 2.4s ease-in-out infinite; }
    .crest {
      position: absolute; inset: 0; box-sizing: border-box; border-radius: 6px; overflow: hidden;
      border: 2.5px solid transparent;
      background: linear-gradient(#000,#000) padding-box, linear-gradient(135deg, #fff6c8, #e8b53c 35%, #8a5a10 55%, #ffe38a 80%, #b9770e) border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,.65), 0 0 7px var(--glow);
    }
    .crest svg { display: block; width: 100%; height: 100%; }
    .crest::after { content: ''; position: absolute; top: -20%; bottom: -20%; width: 30%; left: -50%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-18deg); animation: shine 4.5s ease-in-out infinite; }
    .gem { position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; margin-left: -5px; transform: rotate(45deg); background: linear-gradient(135deg, #fff, var(--ac) 45%, var(--ac2)); border: 1.2px solid #f2c230; box-shadow: 0 0 5px var(--glow); }

    /* Placa del nombre: HUD gamer con inclinación, acento de color y tipografía con relieve. */
    .pill {
      position: absolute; left: 12px; top: 63px; width: 136px; height: 21px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
      background: linear-gradient(180deg, #2b1c0e, #120a04);
      filter: drop-shadow(0 1.5px 2px rgba(0,0,0,.6));
    }
    .pill::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--ac2), transparent 28%, transparent 72%, var(--ac)); opacity: .55; }
    .pill::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px; background: linear-gradient(90deg, var(--ac2), #f2c230, var(--ac)); }
    .name {
      position: relative; z-index: 1; font-size: 14.5px; line-height: 17px; font-style: italic; letter-spacing: 1.6px; margin-top: -1px;
      font-family: Impact, 'Haettenschweiler', 'Arial Narrow Bold', 'Arial Black', sans-serif; font-weight: 900;
      background: linear-gradient(180deg, #ffffff 15%, #ffe9a6 55%, #f2b92b); -webkit-background-clip: text; background-clip: text; color: transparent;
      -webkit-text-stroke: .45px rgba(0,0,0,.85); paint-order: stroke fill;
      filter: drop-shadow(0 1px 0 #000) drop-shadow(0 0 3px var(--glow));
    }

    /* Copas ganadas. */
    .cups {
      position: absolute; left: 78px; top: 17px; width: 42px; height: 42px; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 8px; border: 1.6px solid #f2c230;
      background: radial-gradient(circle at 50% 0, #5a3a0e, #1b1004 75%);
      box-shadow: inset 0 0 6px rgba(242,194,48,.35), 0 2px 4px rgba(0,0,0,.55);
    }
    .cups svg { width: 17px; height: 17px; margin-top: -1px; filter: drop-shadow(0 0 3px rgba(255,214,90,.8)); animation: cupglow 2.6s ease-in-out infinite; }
    .cups .n { font-size: 13px; line-height: 13px; margin-top: 0; color: #ffd84d; -webkit-text-stroke: .35px #5a3a05; text-shadow: 0 1px 1px #000, 0 0 5px rgba(251,191,36,.7); transform-origin: 50% 60%; }
    .cups .l { position: absolute; bottom: -5px; padding: 0 3px; font-size: 4.6px; line-height: 7px; letter-spacing: .6px; color: #fff; background: #7a1f12; border: 1px solid #f2c230; border-radius: 4px; }
    .cups.pop { animation: pop .9s cubic-bezier(.2,1.6,.4,1); }
    .cups.pop .n { animation: numpop .9s cubic-bezier(.2,1.6,.4,1); }
    .confetti { position: absolute; left: 99px; top: 38px; width: 0; height: 0; }
    .confetti i { position: absolute; width: 3px; height: 5px; border-radius: 1px; opacity: 0; animation: burst 1.1s ease-out forwards; }

    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.2px); } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes shine { 0%, 58% { left: -50%; } 82%, 100% { left: 130%; } }
    @keyframes cupglow { 0%,100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.1) rotate(3deg); } }
    @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.3) rotate(-5deg); } 100% { transform: scale(1); } }
    @keyframes numpop { 0% { transform: scale(.4); } 60% { transform: scale(1.5); } 100% { transform: scale(1); } }
    @keyframes burst { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }
    @media (prefers-reduced-motion: reduce) { .crest-wrap, .crest::after, .cups svg, .crest-wrap::before { animation: none; } }
  </style>
</head>
<body>
  <div class="board">
    <div class="crest-wrap">
      <div class="crest"><svg viewBox="0 0 56 41" preserveAspectRatio="none"><rect width="56" height="41" fill="#fff"/><rect y="12" width="56" height="17" fill="#111"/><circle cx="28" cy="20.5" r="10" fill="#e5e5e5" stroke="#111" stroke-width="1.6"/><circle cx="28" cy="20.5" r="6.5" fill="none" stroke="#111" stroke-width="1"/><path d="M28 14v13M21.5 20.5h13M23.4 15.9l9.2 9.2M32.6 15.9l-9.2 9.2" stroke="#111" stroke-width=".9"/></svg></div>
      <i class="gem"></i>
    </div>
    <div class="pill"><span class="name" id="team-1">OLIMPIA</span></div>
    <div class="cups" id="cups-box">
      <svg viewBox="0 0 24 24"><defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".55" stop-color="#f5b82e"/><stop offset="1" stop-color="#b9770e"/></linearGradient></defs>
        <path d="M6 3h12v5.5a6 6 0 0 1-12 0Z" fill="url(#gold)" stroke="#8a5a10" stroke-width="1"/>
        <path d="M6 5H2.6c0 3.4 1.4 5.2 4 5.6M18 5h3.4c0 3.4-1.4 5.2-4 5.6" fill="none" stroke="#e8a317" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="10.4" y="14" width="3.2" height="4" fill="#e8a317" stroke="#8a5a10" stroke-width=".7"/>
        <rect x="7" y="18" width="10" height="3.2" rx="1" fill="url(#gold)" stroke="#8a5a10" stroke-width="1"/>
        <path d="M9 5.2c0 3 .6 4.6 2 5.4" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span class="n" id="cups-n">0</span>
      <span class="l">COPAS</span>
    </div>
    <div class="confetti" id="confetti"></div>
  </div>
  <script src="/layers/game-core.js"></script>
  <script src="/layers/flags.js"></script>
  <script>
    (function () {
      var idx = 0, box = document.getElementById('cups-box'), n = document.getElementById('cups-n');
      var nameEl = document.getElementById('team-1'), crest = document.querySelector('.crest');
      var originalFlag = crest.querySelector('svg').outerHTML, currentFlag = null;
      var conf = document.getElementById('confetti'), prev = null;
      var COLORS = ['#ffd84d', '#ff5a5a', '#5bd6ff', '#7dff9a', '#ffffff', '#ff9bf0'];
      function burst() {
        conf.innerHTML = '';
        for (var k = 0; k < 18; k++) {
          var e = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 14 + Math.random() * 26;
          e.style.background = COLORS[k % COLORS.length];
          e.style.setProperty('--dx', Math.cos(a) * d + 'px'); e.style.setProperty('--dy', (Math.sin(a) * d - 10) + 'px');
          e.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg'); e.style.animationDelay = (Math.random() * .1) + 's';
          conf.appendChild(e);
        }
        setTimeout(function () { conf.innerHTML = ''; }, 1500);
      }
      TortuGame.onState(function (s) {
        var t = s.teams[idx];
        if (nameEl.textContent !== t.name) nameEl.textContent = t.name;
        if (t.flag !== currentFlag) {
          currentFlag = t.flag || null;
          if (!currentFlag) crest.innerHTML = originalFlag;
          else {
            var parsed = new DOMParser().parseFromString(TortuFlags.svg(currentFlag), 'image/svg+xml');
            if (!parsed.querySelector('parsererror')) crest.replaceChildren(parsed.documentElement.cloneNode(true));
          }
        }
        var c = String(t.cups);
        if (n.textContent !== c) {
          n.textContent = c;
          if (prev !== null && t.cups > prev) {
            box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop'); burst();
          }
        }
        prev = t.cups;
      });
    })();
  </script>
</body>
</html>
