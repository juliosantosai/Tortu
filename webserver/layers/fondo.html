<!--
Archivo: layers/fondo.html
Propósito: marco de madera general y las dos tarjetas (una por equipo) + 5 ESCENARIOS DE FONDO
dinámicos gamificados (1 Selva, 2 Océano, 3 Espacio, 4 Desierto, 5 Volcán).
El escenario se elige con el botón FONDOS (panel / overlay privado), con ?fondo=N en la URL del
overlay, o con un mensaje {type:'scene', scene:N} (0 = madera original).
Debe respetar:
- ocupar el 100% del canvas
- ser decorativo y no interactivo
- no incluir texto ni controles
- seguir el modelo gráfico (madera oscura, tarjetas marrón claro) en el modo original
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif; font-weight: 900;
    }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board { position: absolute; left: 0; top: 0; width: 316px; height: 562px; transform: scale(3.417722); transform-origin: 0 0; }

    .frame {
      position: absolute; inset: 0; box-sizing: border-box;
      border-radius: 13px; border: 2px solid #24150a;
      background:
        repeating-linear-gradient(90deg, transparent 0 78px, rgba(0,0,0,.26) 78px 79px),
        repeating-linear-gradient(180deg, transparent 0 21px, rgba(0,0,0,.12) 21px 22px),
        linear-gradient(90deg, #3f2813, #533620 50%, #3f2813);
      box-shadow: inset 0 0 0 2px #7a5430, inset 0 0 14px rgba(0,0,0,.55);
      transition: background .6s, border-color .6s, box-shadow .6s;
    }
    .card {
      position: absolute; top: 13px; width: 145px; height: 545px; box-sizing: border-box;
      border-radius: 9px; border: 2px solid #4a2d14;
      background:
        repeating-linear-gradient(90deg, transparent 0 46px, rgba(58,33,13,.26) 46px 47px),
        repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 3px, transparent 3px 7px),
        linear-gradient(180deg, #b57c46, #a26d38 45%, #935f2e);
      box-shadow: inset 0 0 0 1px #cf9a60, inset 0 3px 8px rgba(255,225,180,.22), 0 3px 7px rgba(0,0,0,.45);
    }
    .card.l { left: 6px; }
    .card.r { left: 165px; }
    .dot {
      position: absolute; top: 7.5px; width: 5px; height: 5px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #6b4a2a, #1a0f07);
      box-shadow: 0 .5px 0 rgba(255,220,170,.25);
    }

    /* ================= ESCENARIOS ================= */
    .scenes { position: absolute; inset: 0; border-radius: 13px; overflow: hidden; }
    .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; overflow: hidden; }
    .scene.on { opacity: 1; }
    .scene > * { position: absolute; }
    .scene i.p { display: block; }

    /* Modo escenario: marco fino de neón y tarjetas de cristal teñidas. */
    body[data-scene="1"] { --ac: #7dff9a; --tint: 4,38,16; }
    body[data-scene="2"] { --ac: #5bd6ff; --tint: 2,24,52; }
    body[data-scene="3"] { --ac: #b58cff; --tint: 14,6,40; }
    body[data-scene="4"] { --ac: #ffb347; --tint: 48,18,6; }
    body[data-scene="5"] { --ac: #ff6a3d; --tint: 40,6,2; }
    body[data-scene]:not([data-scene="0"]) .frame {
      background: transparent; border-color: var(--ac);
      box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.55), inset 0 0 16px 2px color-mix(in srgb, var(--ac) 55%, transparent), 0 0 8px color-mix(in srgb, var(--ac) 70%, transparent);
    }
    body[data-scene]:not([data-scene="0"]) .card {
      border-color: color-mix(in srgb, var(--ac) 80%, #000);
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,.04) 0 1px, transparent 1px 5px),
        linear-gradient(180deg, rgba(var(--tint), .26), rgba(var(--tint), .46));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), inset 0 0 14px color-mix(in srgb, var(--ac) 30%, transparent), 0 0 9px color-mix(in srgb, var(--ac) 45%, transparent), 0 3px 7px rgba(0,0,0,.45);
      backdrop-filter: blur(1.5px);
    }
    body[data-scene]:not([data-scene="0"]) .dot { background: radial-gradient(circle at 35% 30%, #fff, var(--ac)); box-shadow: 0 0 5px var(--ac); animation: led 1.6s ease-in-out infinite; }
    .dot:nth-of-type(2n) { animation-delay: -.5s; } .dot:nth-of-type(3n) { animation-delay: -1s; }
    @keyframes led { 50% { opacity: .35; } }

    /* ---- 1 SELVA ---- */
    .s1 { background: radial-gradient(ellipse at 50% 0, #1f7a3a 0, #0d4a22 45%, #052212 100%); }
    .s1 .rays { inset: -30% -10% auto -10%; height: 90%; background: repeating-conic-gradient(from 200deg at 50% 0, rgba(255,255,170,.14) 0 6deg, transparent 6deg 16deg); transform-origin: 50% 0; animation: rays 14s ease-in-out infinite alternate; -webkit-mask-image: linear-gradient(180deg,#000,transparent 85%); mask-image: linear-gradient(180deg,#000,transparent 85%); }
    @keyframes rays { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    .s1 .vine { top: -4px; width: 14px; height: 110px; transform-origin: 50% 0; animation: swing 5s ease-in-out infinite alternate; }
    @keyframes swing { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
    .s1 .bush { bottom: -14px; width: 130px; height: 70px; border-radius: 50% 50% 0 0; background: radial-gradient(circle at 30% 40%, #1c7a36, #0a3a1a 70%); filter: drop-shadow(0 -2px 3px rgba(0,0,0,.5)); animation: breathe 6s ease-in-out infinite alternate; }
    @keyframes breathe { to { transform: scale(1.04) translateY(-2px); } }
    .leaf { width: 7px; height: 11px; border-radius: 0 100% 0 100%; background: linear-gradient(135deg, #8cf06a, #1f9a3c); opacity: .9; top: -14px; animation: leaf var(--d) linear infinite; animation-delay: var(--dl); left: var(--x); }
    @keyframes leaf { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(14px,150px) rotate(120deg); } 50% { transform: translate(-10px,300px) rotate(240deg); } 75% { transform: translate(16px,450px) rotate(330deg); } 100% { transform: translate(0,590px) rotate(450deg); } }
    .fly { width: 3px; height: 3px; border-radius: 50%; background: #eaff8a; box-shadow: 0 0 5px 2px rgba(226,255,110,.9); left: var(--x); top: var(--y); animation: fly var(--d) ease-in-out infinite alternate, tw 1.8s ease-in-out infinite; animation-delay: var(--dl), var(--dl); }
    @keyframes fly { to { transform: translate(var(--dx), var(--dy)); } }
    @keyframes tw { 50% { opacity: .2; } }

    /* ---- 2 OCÉANO ---- */
    .s2 { background: linear-gradient(180deg, #38b6e8 0, #0a74b8 18%, #064a8c 55%, #021a3c 100%); }
    .s2 .caustic { inset: -20%; background:
        radial-gradient(ellipse 30px 12px at 20% 20%, rgba(255,255,255,.18), transparent 70%),
        radial-gradient(ellipse 40px 14px at 70% 35%, rgba(255,255,255,.14), transparent 70%),
        radial-gradient(ellipse 34px 12px at 40% 60%, rgba(255,255,255,.12), transparent 70%),
        radial-gradient(ellipse 44px 16px at 85% 80%, rgba(255,255,255,.10), transparent 70%);
      animation: caus 9s ease-in-out infinite alternate; }
    @keyframes caus { to { transform: translate(20px, 30px) scale(1.12); } }
    .s2 .wave { left: -100%; width: 300%; height: 18px; top: 8px; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='18' viewBox='0 0 80 18'><path d='M0 9Q20 0 40 9T80 9V18H0Z' fill='%23ffffff' fill-opacity='.28'/></svg>") 0 0 / 80px 18px repeat-x; animation: wave 6s linear infinite; }
    .s2 .wave.b { top: 14px; opacity: .6; animation-duration: 9s; animation-direction: reverse; }
    @keyframes wave { to { transform: translateX(80px); } }
    .bubble { left: var(--x); bottom: -8px; width: var(--s); height: var(--s); border-radius: 50%; border: 1px solid rgba(255,255,255,.7); background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.08)); animation: rise var(--d) ease-in infinite; animation-delay: var(--dl); }
    @keyframes rise { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(6px,-290px); } 100% { transform: translate(-4px,-580px); opacity: 0; } }
    .fish { top: var(--y); left: -30px; width: 18px; height: 9px; animation: swim var(--d) linear infinite; animation-delay: var(--dl); }
    .fish::before { content: ''; position: absolute; inset: 0; border-radius: 60% 40% 40% 60% / 50%; background: linear-gradient(90deg, var(--c), #fff7); }
    .fish::after { content: ''; position: absolute; right: -5px; top: 0; border-left: 7px solid var(--c); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; animation: tail .4s ease-in-out infinite alternate; transform-origin: 0 50%; }
    @keyframes tail { to { transform: scaleY(.55); } }
    @keyframes swim { from { transform: translateX(0); } to { transform: translateX(370px); } }
    .fish.rev { left: auto; right: -30px; animation-name: swimr; transform: scaleX(-1); }
    @keyframes swimr { from { transform: scaleX(-1) translateX(0); } to { transform: scaleX(-1) translateX(370px); } }
    .weed { bottom: -3px; width: 7px; height: 60px; border-radius: 4px 4px 0 0; background: linear-gradient(0deg, #0e6a3a, #3ad17a); transform-origin: 50% 100%; animation: sway2 3.2s ease-in-out infinite alternate; }
    @keyframes sway2 { from { transform: rotate(-8deg) skewX(-4deg); } to { transform: rotate(8deg) skewX(4deg); } }

    /* ---- 3 ESPACIO ---- */
    .s3 { background: radial-gradient(ellipse at 20% 15%, #2a0f66 0, transparent 55%), radial-gradient(ellipse at 85% 80%, #0b2a74 0, transparent 55%), #04010d; }
    .s3 .neb { width: 220px; height: 220px; border-radius: 50%; filter: blur(22px); opacity: .55; animation: nebm 18s ease-in-out infinite alternate; }
    .s3 .neb.a { left: -60px; top: 150px; background: radial-gradient(circle, #a23cff, transparent 70%); }
    .s3 .neb.b { right: -70px; top: 330px; background: radial-gradient(circle, #1fb5ff, transparent 70%); animation-delay: -6s; }
    @keyframes nebm { to { transform: translate(24px, -30px) scale(1.2); } }
    .star { left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%; background: #fff; box-shadow: 0 0 4px 1px rgba(200,220,255,.9); animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--dl); }
    @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.3); } }
    .shoot { left: var(--x); top: var(--y); width: 60px; height: 1.5px; background: linear-gradient(90deg, transparent, #fff); transform: rotate(35deg); transform-origin: 100% 50%; opacity: 0; animation: shoot 5s ease-in infinite; animation-delay: var(--dl); }
    @keyframes shoot { 0% { opacity: 0; translate: 0 0; } 4% { opacity: 1; } 12% { opacity: 0; translate: 120px 85px; } 100% { opacity: 0; translate: 120px 85px; } }
    .planet { left: 232px; top: 468px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffd09a, #d9622b 55%, #5a1b0a); box-shadow: inset -14px -10px 22px rgba(0,0,0,.6); animation: drift 20s ease-in-out infinite alternate; }
    .planet::after { content: ''; position: absolute; left: -26px; right: -26px; top: 50px; height: 22px; border-radius: 50%; border: 4px solid rgba(255,220,170,.6); transform: rotate(-18deg); }
    @keyframes drift { to { transform: translate(-14px, -12px) rotate(6deg); } }
    .moon { left: -26px; top: 70px; width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #b9c2d8 60%, #6b7391); box-shadow: inset -8px -6px 12px rgba(0,0,0,.45); animation: drift 14s ease-in-out infinite alternate-reverse; }
    .rocket { left: 0; top: 0; width: 8px; height: 18px; animation: fly3 16s linear infinite; }
    .rocket::before { content: ''; position: absolute; inset: 0; border-radius: 50% 50% 20% 20%; background: linear-gradient(90deg, #cfd6e6, #fff 50%, #9aa5c0); }
    .rocket::after { content: ''; position: absolute; left: 1.5px; right: 1.5px; top: 17px; height: 12px; border-radius: 0 0 50% 50%; background: linear-gradient(180deg, #ffd84d, #ff5a1f, transparent); animation: flame .15s ease-in-out infinite alternate; }
    @keyframes flame { to { transform: scaleY(1.4); } }
    @keyframes fly3 { 0% { transform: translate(40px, 600px) rotate(8deg); } 100% { transform: translate(280px, -40px) rotate(8deg); } }

    /* ---- 4 DESIERTO ---- */
    .s4 { background: linear-gradient(180deg, #2a0f4a 0, #8a2a5e 22%, #ff6a3d 52%, #ffb457 78%, #ffe0a0 100%); }
    .s4 .sun { left: 108px; top: 150px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #fff6c0 0, #ffd36a 45%, #ff8a3d 75%); box-shadow: 0 0 40px 18px rgba(255,170,70,.6); animation: sunp 5s ease-in-out infinite alternate; }
    @keyframes sunp { to { transform: scale(1.06); box-shadow: 0 0 55px 24px rgba(255,170,70,.75); } }
    .s4 .dune { left: -20%; width: 140%; border-radius: 50% 50% 0 0 / 40% 40% 0 0; animation: dunes 12s ease-in-out infinite alternate; }
    .s4 .d1 { bottom: 120px; height: 120px; background: linear-gradient(180deg, #e0713a, #a8431f); opacity: .9; }
    .s4 .d2 { bottom: 40px; height: 140px; background: linear-gradient(180deg, #c4572a, #7d2f14); animation-duration: 9s; animation-direction: alternate-reverse; }
    .s4 .d3 { bottom: -30px; height: 140px; background: linear-gradient(180deg, #8e3a18, #4a1a0a); animation-duration: 7s; }
    @keyframes dunes { to { transform: translateX(22px); } }
    .s4 .cactus { bottom: 70px; width: 9px; height: 46px; border-radius: 5px; background: linear-gradient(90deg, #14502a, #2c8d4a); animation: sway2 4s ease-in-out infinite alternate; transform-origin: 50% 100%; }
    .s4 .cactus::before, .s4 .cactus::after { content: ''; position: absolute; width: 5px; height: 14px; border-radius: 3px; background: #1f7a3c; top: 14px; }
    .s4 .cactus::before { left: -8px; border-bottom-left-radius: 0; } .s4 .cactus::after { right: -8px; top: 22px; }
    .dust { left: -20px; top: var(--y); width: var(--s); height: 2px; border-radius: 2px; background: rgba(255,230,190,.55); animation: gust var(--d) linear infinite; animation-delay: var(--dl); }
    @keyframes gust { from { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateX(380px); opacity: 0; } }
    .bird { left: -20px; top: var(--y); width: 12px; height: 6px; animation: gust var(--d) linear infinite; animation-delay: var(--dl); }
    .bird::before, .bird::after { content: ''; position: absolute; top: 0; width: 6px; height: 3px; border-top: 1.5px solid #2a0f1a; border-radius: 50% 50% 0 0; animation: flap .35s ease-in-out infinite alternate; }
    .bird::before { left: 0; transform-origin: 100% 100%; } .bird::after { right: 0; transform-origin: 0 100%; animation-direction: alternate-reverse; }
    @keyframes flap { to { transform: scaleY(-.6); } }

    /* ---- 5 VOLCÁN ---- */
    .s5 { background: linear-gradient(180deg, #120202 0, #3a0905 40%, #8a1c06 78%, #ff5a14 100%); }
    .s5 .glow { left: -20%; right: -20%; bottom: -30px; height: 190px; background: radial-gradient(ellipse at 50% 100%, rgba(255,170,40,.9), rgba(255,70,10,.55) 45%, transparent 72%); animation: lava 2.6s ease-in-out infinite alternate; }
    @keyframes lava { from { opacity: .6; transform: scaleY(.9); } to { opacity: 1; transform: scaleY(1.1); } }
    .s5 .rock { bottom: -6px; width: 150px; height: 130px; background: linear-gradient(180deg, #1c0a08, #0a0403); clip-path: polygon(0 100%, 12% 55%, 28% 70%, 45% 20%, 62% 62%, 78% 40%, 100% 100%); }
    .s5 .crack { bottom: 0; width: 2px; height: 80px; background: linear-gradient(0deg, #ffd04a, #ff5a14, transparent); box-shadow: 0 0 6px #ff7a1a; animation: crack 1.8s ease-in-out infinite alternate; transform-origin: 50% 100%; }
    @keyframes crack { to { opacity: .4; } }
    .ember { left: var(--x); bottom: -6px; width: var(--s); height: var(--s); border-radius: 50%; background: radial-gradient(circle, #fff3a0, #ff7a1a 60%, transparent); animation: ember var(--d) ease-out infinite; animation-delay: var(--dl); }
    @keyframes ember { 0% { transform: translate(0,0) scale(1); opacity: 0; } 10% { opacity: 1; } 60% { transform: translate(var(--dx), -330px) scale(.8); opacity: .9; } 100% { transform: translate(calc(var(--dx) * 1.6), -560px) scale(.2); opacity: 0; } }
    .smoke { left: var(--x); top: 300px; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle, rgba(60,40,36,.55), transparent 70%); filter: blur(6px); animation: smoke var(--d) ease-in infinite; animation-delay: var(--dl); }
    @keyframes smoke { from { transform: translateY(260px) scale(.6); opacity: 0; } 25% { opacity: .8; } to { transform: translateY(-300px) scale(1.8); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { .scene *, .dot { animation: none !important; } }

    /* ---- Escenarios 6 a 10 ---- */
    body[data-scene="6"] { --ac: #bfe9ff; --tint: 6,22,48; } body[data-scene="7"] { --ac: #ff4df0; --tint: 30,4,50; }
    body[data-scene="8"] { --ac: #7dff9a; --tint: 4,40,16; } body[data-scene="9"] { --ac: #ff8ad8; --tint: 60,10,50; } body[data-scene="10"] { --ac: #9fb8ff; --tint: 8,12,28; }
    .s6 { background: linear-gradient(180deg, #0b1d44, #1c4a86 60%, #cfe8ff); }
    .s7 { background: linear-gradient(180deg, #14002e, #4b0a6e 40%, #ff2d95 60%, #2a0050 60%, #14002e); }
    .s7 .sun { left: 93px; top: 190px; width: 130px; height: 130px; border-radius: 50%; background: linear-gradient(180deg, #ffe45e, #ff2d95); -webkit-mask: repeating-linear-gradient(180deg, #000 0 10px, transparent 10px 14px); mask: repeating-linear-gradient(180deg, #000 0 10px, transparent 10px 14px); }
    .s7 .grid { left: 0; right: 0; bottom: 0; height: 40%; background: repeating-linear-gradient(90deg, rgba(255,77,240,.7) 0 1px, transparent 1px 24px), repeating-linear-gradient(0deg, rgba(255,77,240,.7) 0 1px, transparent 1px 24px); animation: gridm 1.2s linear infinite; }
    @keyframes gridm { to { background-position: 0 0, 0 24px; } }
    .s8 { background: linear-gradient(180deg, #06210f, #0d4a22 40%, #14803a); }
    .s8 .turf { left: 0; right: 0; bottom: 0; height: 55%; background: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 30px, transparent 30px 60px); }
    .s8 .beam { top: -20px; width: 120px; height: 420px; background: linear-gradient(180deg, rgba(255,255,200,.5), transparent 85%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); transform-origin: 50% 0; animation: beam 5s ease-in-out infinite alternate; }
    @keyframes beam { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
    .s9 { background: linear-gradient(160deg, #ffb3e6, #b79cff 50%, #7fe7ff); }
    .s10 { background: linear-gradient(180deg, #0a0f1e, #1b2744 60%, #2c3a5c); }
    .s10 .bolt { inset: 0; background: #dfe8ff; opacity: 0; animation: bolt 6s infinite; }
    @keyframes bolt { 0%, 88%, 93%, 100% { opacity: 0; } 89% { opacity: .75; } 91% { opacity: .15; } 92% { opacity: .6; } }
    .pt { top: -30px; left: var(--x); font-size: var(--s); animation: ptf var(--d) linear infinite; animation-delay: var(--dl); will-change: transform; }
    .pt.up { top: auto; bottom: -30px; animation-name: ptu; }
    .pt.rain { width: 1.5px; height: 16px; font-size: 0; background: linear-gradient(transparent, #a9c8ff); }
    @keyframes ptf { to { transform: translate(var(--dx), 620px) rotate(var(--r)); } }
    @keyframes ptu { to { transform: translate(var(--dx), -620px) rotate(var(--r)); } }
  </style>
</head>
<body data-scene="0">
  <div class="board">
    <div class="frame"></div>
    <div class="scenes" id="scenes">
      <div class="scene s1" data-n="1"></div>
      <div class="scene s2" data-n="2"></div>
      <div class="scene s3" data-n="3"></div>
      <div class="scene s4" data-n="4"></div>
      <div class="scene s5" data-n="5"></div>
      <div class="scene s6" data-n="6"></div>
      <div class="scene s7" data-n="7"></div>
      <div class="scene s8" data-n="8"></div>
      <div class="scene s9" data-n="9"></div>
      <div class="scene s10" data-n="10"></div>
    </div>
    <div class="card l"></div>
    <div class="card r"></div>
    <i class="dot" style="left:10.5px"></i><i class="dot" style="left:20.5px"></i><i class="dot" style="left:29.5px"></i>
    <i class="dot" style="left:169.5px"></i><i class="dot" style="left:179.5px"></i><i class="dot" style="left:188.5px"></i>
  </div>
  <script>
    (function () {
      var KEY = 'tortulive.scene';
      var R = function (a, b) { return a + Math.random() * (b - a); };
      var el = function (cls, style, parent) { var e = document.createElement('i'); e.className = cls; if (style) e.style.cssText = style; parent.appendChild(e); return e; };
      var built = {};

      var builders = {
        1: function (s) {
          el('rays', '', s);
          for (var i = 0; i < 9; i++) el('vine', 'left:' + (i * 36 - 4) + 'px;height:' + R(60, 130) + 'px;animation-delay:-' + R(0, 5) + 's;background:linear-gradient(180deg,#0b5a24,#2da24a 60%,#7de06a);border-radius:0 0 8px 8px;opacity:.9', s);
          for (i = 0; i < 16; i++) el('leaf', '--x:' + R(0, 306) + 'px;--d:' + R(9, 18) + 's;--dl:-' + R(0, 18) + 's', s);
          for (i = 0; i < 22; i++) el('fly', '--x:' + R(0, 310) + 'px;--y:' + R(40, 540) + 'px;--dx:' + R(-30, 30) + 'px;--dy:' + R(-40, 40) + 'px;--d:' + R(4, 9) + 's;--dl:-' + R(0, 8) + 's', s);
          el('bush', 'left:-30px', s); el('bush', 'left:110px;width:150px;animation-delay:-2s', s); el('bush', 'left:230px;animation-delay:-4s', s);
        },
        2: function (s) {
          el('caustic', '', s); el('wave', '', s); el('wave b', '', s);
          for (var i = 0; i < 20; i++) el('bubble', '--x:' + R(0, 306) + 'px;--s:' + R(3, 9) + 'px;--d:' + R(6, 13) + 's;--dl:-' + R(0, 13) + 's', s);
          var C = ['#ffb347', '#ff6a6a', '#ffe14d', '#7dffd2'];
          for (i = 0; i < 6; i++) el('fish' + (i % 2 ? ' rev' : ''), '--y:' + R(80, 500) + 'px;--c:' + C[i % 4] + ';--d:' + R(9, 17) + 's;--dl:-' + R(0, 15) + 's', s);
          for (i = 0; i < 16; i++) el('weed', 'left:' + (i * 20 + R(-4, 4)) + 'px;height:' + R(34, 80) + 'px;animation-delay:-' + R(0, 3) + 's', s);
        },
        3: function (s) {
          el('neb a', '', s); el('neb b', '', s);
          for (var i = 0; i < 70; i++) el('star', '--x:' + R(0, 314) + 'px;--y:' + R(0, 560) + 'px;--s:' + R(1, 2.6) + 'px;--d:' + R(1.6, 4.5) + 's;--dl:-' + R(0, 4) + 's', s);
          for (i = 0; i < 3; i++) el('shoot', '--x:' + R(20, 160) + 'px;--y:' + R(10, 300) + 'px;--dl:-' + (i * 1.7) + 's;animation-duration:' + (5 + i * 1.3) + 's', s);
          el('planet', '', s); el('moon', '', s); el('rocket', '', s);
        },
        4: function (s) {
          el('sun', '', s);
          el('dune d1', '', s);
          for (var i = 0; i < 3; i++) el('cactus', 'left:' + (30 + i * 120 + R(-10, 10)) + 'px;height:' + R(32, 52) + 'px;animation-delay:-' + R(0, 4) + 's', s);
          el('dune d2', '', s); el('dune d3', '', s);
          for (i = 0; i < 12; i++) el('dust', '--y:' + R(250, 540) + 'px;--s:' + R(10, 34) + 'px;--d:' + R(2.5, 6) + 's;--dl:-' + R(0, 6) + 's', s);
          for (i = 0; i < 3; i++) el('bird', '--y:' + R(60, 220) + 'px;--d:' + R(14, 22) + 's;--dl:-' + R(0, 18) + 's', s);
        },
        5: function (s) {
          for (var i = 0; i < 4; i++) el('smoke', '--x:' + R(-20, 270) + 'px;--d:' + R(8, 14) + 's;--dl:-' + R(0, 12) + 's', s);
          el('glow', '', s);
          el('rock', 'left:-30px', s); el('rock', 'left:90px;width:190px;height:150px', s); el('rock', 'left:200px', s);
          for (i = 0; i < 6; i++) el('crack', 'left:' + R(10, 300) + 'px;height:' + R(30, 90) + 'px;transform:rotate(' + R(-25, 25) + 'deg);animation-delay:-' + R(0, 2) + 's', s);
          for (i = 0; i < 34; i++) el('ember', '--x:' + R(0, 314) + 'px;--s:' + R(2, 5) + 'px;--dx:' + R(-30, 30) + 'px;--d:' + R(3, 8) + 's;--dl:-' + R(0, 8) + 's', s);
        },
        6: function (s) { pts(s, ['❄', '❅', '❆'], 46, 12, 5, 0); },
        7: function (s) { el('sun', '', s); el('grid', '', s); pts(s, ['✨', '💜', '⭐'], 18, 10, 9, 1); },
        8: function (s) { el('turf', '', s); for (var i = 0; i < 3; i++) el('beam', 'left:' + (i * 100 - 10) + 'px;animation-delay:-' + i * 1.7 + 's', s); pts(s, ['⚽', '🎉', '🏆'], 22, 16, 10, 0); },
        9: function (s) { pts(s, ['🍬', '🍭', '🍩', '🧁'], 26, 22, 7, 1); },
        10: function (s) { el('bolt', '', s); for (var i = 0; i < 60; i++) el('pt rain', '--x:' + R(0, 320) + 'px;--dx:-30px;--r:0deg;--d:' + R(.5, .9) + 's;--dl:-' + R(0, 1) + 's', s); }
      };
      function pts(s, em, n, size, dur, up) {
        for (var i = 0; i < n; i++) {
          var e = el('pt' + (up ? ' up' : ''), '--x:' + R(0, 300) + 'px;--s:' + R(size * .6, size * 1.4) + 'px;--dx:' + R(-40, 40) + 'px;--r:' + R(-360, 360) + 'deg;--d:' + R(dur, dur * 2) + 's;--dl:-' + R(0, dur * 2) + 's', s);
          e.textContent = em[i % em.length];
        }
      }

      function setScene(n) {
        n = parseInt(n, 10);
        if (!(n >= 0 && n <= 10)) n = 0;
        document.body.setAttribute('data-scene', String(n));
        document.querySelectorAll('.scene').forEach(function (s) {
          var on = Number(s.dataset.n) === n;
          if (on && !built[n]) { built[n] = true; builders[n](s); }
          s.classList.toggle('on', on);
        });
      }

      var q = '';
      try { q = new URLSearchParams(window.parent.location.search).get('fondo') || ''; } catch (e) { /* otro origen */ }
      var saved = '0';
      try { saved = localStorage.getItem(KEY) || '0'; } catch (e) { /* sin storage */ }
      setScene(q !== '' ? q : saved);

      window.addEventListener('storage', function (e) { if (e.key === KEY) setScene(e.newValue); });
      try { new BroadcastChannel('tortulive-scene').onmessage = function (e) { setScene(e.data && e.data.scene); }; } catch (e) { /* sin BroadcastChannel */ }
      window.addEventListener('message', function (event) {
        if (event.origin !== location.origin || !event.data || event.data.channel !== 'tortulive') return;
        var m = event.data.message;
        if (m && m.type === 'scene') setScene(m.scene);
      });
    })();
  </script>
</body>
