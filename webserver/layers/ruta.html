<!--
Archivo: layers/ruta.html
Propósito: la RUTA gamificada que recorre cada tortuga: camino de puntos que avanza hacia la meta,
huellas que va dejando la tortuga y 4 puntos de control (25/50/75/100 m) con estrella que se
enciende y hace un destello al pasar por ellos.
Debe respetar:
- ir entre la pista y la meta, debajo de las tortugas
- no ocultar tortugas ni banderas
- ser decorativa (solo lee el avance para encender los hitos)
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif; font-weight: 900;
    }
    @property --ext { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --hdr { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
    :root { transition: --ext .35s ease, --hdr .35s ease; }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board { position: absolute; left: 0; top: 0; width: 316px; height: 562px; transform: scale(3.417722); transform-origin: 0 0; }

    .route { position: absolute; left: 0; top: 0; width: 316px; height: 562px; --p: 0; transition: --p 1.3s cubic-bezier(.3,.7,.3,1); }
    .route.l { --cx: 78.5px; --c1: #dbe7ff; --c2: #7aa2ff; }
    .route.r { --cx: 237.5px; --c1: #8fb0ff; --c2: #ff4d6d; }
    /* Mismo recorrido que la tortuga: centro de la tortuga en p. */
    .route { --run: calc(275.5px + var(--ext)); --y0: 470px; }
    .route > * { position: absolute; }

    /* Camino completo (tenue) con puntos que "marchan" hacia la meta. */
    .path {
      left: calc(var(--cx) - 2px); width: 4px; top: calc(var(--y0) - var(--run)); height: var(--run); border-radius: 2px;
      background: repeating-linear-gradient(180deg, rgba(255,240,210,.30) 0 4px, transparent 4px 10px);
      animation: march 1s linear infinite;
    }
    @keyframes march { from { background-position-y: 10px; } to { background-position-y: 0; } }
    /* Tramo ya recorrido: brillante y relleno. */
    .done {
      left: calc(var(--cx) - 3px); width: 6px; bottom: calc(562px - var(--y0)); height: calc(var(--p) * var(--run)); border-radius: 3px;
      background: linear-gradient(0deg, var(--c2), var(--c1));
      box-shadow: 0 0 6px var(--c1), 0 0 12px var(--c2);
      opacity: .85;
    }
    .done::after { content: ''; position: absolute; left: 0; right: 0; height: 45%; background: linear-gradient(0deg, transparent, rgba(255,255,255,.9), transparent); animation: flow 1.2s linear infinite; }
    @keyframes flow { from { bottom: -45%; } to { bottom: 100%; } }

    /* Huellas que deja la tortuga (patrón alterno izq/der). */
    .prints {
      left: calc(var(--cx) - 11px); width: 22px; bottom: calc(562px - var(--y0) - 6px); height: calc(var(--p) * var(--run));
      overflow: hidden; opacity: .55; -webkit-mask-image: linear-gradient(0deg, rgba(0,0,0,.2), #000 80%); mask-image: linear-gradient(0deg, rgba(0,0,0,.2), #000 80%);
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='28' viewBox='0 0 22 28'><g fill='%23ffe9b0'><ellipse cx='5' cy='6' rx='2.6' ry='3.4'/><circle cx='2.2' cy='1.4' r='.9'/><circle cx='5' cy='.6' r='.9'/><circle cx='7.8' cy='1.4' r='.9'/><ellipse cx='17' cy='20' rx='2.6' ry='3.4'/><circle cx='14.2' cy='15.4' r='.9'/><circle cx='17' cy='14.6' r='.9'/><circle cx='19.8' cy='15.4' r='.9'/></g></svg>") 0 0 / 22px 28px repeat-y;
    }

    /* Puntos de control. */
    .cp { left: calc(var(--cx) + 40px); width: 17px; height: 17px; margin-top: -8.5px; top: calc(var(--y0) - var(--f) * var(--run)); }
    .cp .ring {
      position: absolute; inset: 0; border-radius: 50%; box-sizing: border-box; border: 1.6px solid #6b4a2a;
      background: radial-gradient(circle at 40% 30%, #4a3017, #1d1208);
      display: flex; align-items: center; justify-content: center; transition: all .4s;
    }
    .cp svg { width: 10px; height: 10px; fill: #5b4326; transition: fill .4s, filter .4s; }
    .cp .tag {
      position: absolute; left: 21px; top: 3px; font-size: 5.6px; line-height: 10px; letter-spacing: .4px; color: #cdb88f; white-space: nowrap; transition: color .4s;
      text-shadow: 0 1px 1px #000;
    }
    .cp.on .ring { border-color: #f2c230; background: radial-gradient(circle at 40% 30%, #fff1a8, #f2a516 70%); box-shadow: 0 0 7px 1px rgba(255,214,90,.9); }
    .cp.on svg { fill: #fff; filter: drop-shadow(0 0 2px #b9770e); }
    .cp.on .tag { color: #ffe27a; }
    .cp.flash::after {
      content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid #ffe27a; opacity: 0;
      animation: ping .9s ease-out;
    }
    @keyframes ping { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
    .cp.final .ring { border-color: #8a2b1d; }
    .cp.final.on .ring { border-color: #ffd84d; background: radial-gradient(circle at 40% 30%, #fff1a8, #ef4444 85%); box-shadow: 0 0 9px 2px rgba(255,120,80,.95); }
    @media (prefers-reduced-motion: reduce) { .path, .done::after { animation: none; } }
  </style>
</head>
<body>
  <div class="board">
    <div class="route l"><i class="path"></i><i class="prints"></i><i class="done"></i></div>
    <div class="route r"><i class="path"></i><i class="prints"></i><i class="done"></i></div>
  </div>
  <script src="/layers/game-core.js"></script>
  <script>
    (function () {
      var STAR = '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7Z"/></svg>';
      var MARKS = [{ f: .25, t: '25 m' }, { f: .5, t: '50 m' }, { f: .75, t: '75 m' }, { f: 1, t: '100 m' }];
      var routes = [].slice.call(document.querySelectorAll('.route'));
      var cps = routes.map(function (route) {
        return MARKS.map(function (m, k) {
          var el = document.createElement('div');
          el.className = 'cp' + (k === 3 ? ' final' : '');
          el.style.setProperty('--f', m.f);
          el.innerHTML = '<div class="ring">' + STAR + '</div>';
          route.appendChild(el);
          return { el: el, f: m.f, on: false };
        });
      });
      var first = true;
      TortuGame.onState(function (st) {
        routes.forEach(function (route, i) {
          var p = st.teams[i].p;
          route.style.setProperty('--p', p);
          cps[i].forEach(function (c) {
            var on = p >= c.f - 0.001 && p > 0;
            if (on !== c.on) {
              c.on = on; c.el.classList.toggle('on', on);
              if (on && !first) { c.el.classList.remove('flash'); void c.el.offsetWidth; c.el.classList.add('flash'); }
            }
          });
        });
        first = false;
      });
    })();
  </script>
</body>
</html>
