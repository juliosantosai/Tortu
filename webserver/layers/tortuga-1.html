<!--
Archivo: layers/tortuga-1.html
Propósito: tortuga del equipo 1 (OLIMPIA), vista desde arriba, con el escudo en el caparazón.
GAMIFICADA Y CAMINANDO: las 4 patas se mueven en diagonal (paso real de tortuga), la cabeza asiente,
el caparazón se balancea y la cola mueve. Camina siempre despacio y acelera con polvo y líneas de
velocidad cuando avanza. Aura del color del equipo; sube al líder con una estrella.
Variable --p (0 a 1) en .racer: posición en el carril (la fija el script con el estado de la carrera).
Debe respetar:
- usar la identidad visual del equipo 1
- seguir un tamaño y posición apropiados para la pista
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif; font-weight: 900;
    }
    /* Alargue de la pista: index.html fija --ext (px de tablero) según las partes ocultas. */
    @property --ext { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --hdr { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
    @property --sc { syntax: '<number>'; inherits: true; initial-value: 1; }
    :root { transition: --ext .35s ease, --hdr .35s ease; }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board { position: absolute; left: 0; top: 0; width: 316px; height: 562px; transform: scale(3.417722); transform-origin: 0 0; }

    .racer { position: absolute; left: 0; top: 0; --p: 0; --cx: 78.5px; --gl: #dbe7ff; --gl2: #7aa2ff; --step: 1.5s;
      transition: --p 1.3s cubic-bezier(.3,.7,.3,1); }
    .racer.go { --step: .46s; }
    /* Tortuga a escala 1.5 (84x111). p=0: cola apoyada al inicio de la pista; p=1: hocico en la meta.
       El recorrido crece con --ext cuando la pista se alarga. */
    .racer { --y: calc(415px - var(--p) * (275.5px + var(--ext))); }
    .shadow {
      position: absolute; left: calc(var(--cx) - 37.5px); top: calc(var(--y) + 104px);
      width: 75px; height: 12px; border-radius: 50%;
      background: radial-gradient(rgba(0,0,0,.55), transparent 70%);
    }
    .aura {
      position: absolute; left: calc(var(--cx) - 46px); top: calc(var(--y) + 10px); width: 92px; height: 100px; border-radius: 50%;
      background: radial-gradient(closest-side, color-mix(in srgb, var(--gl) 45%, transparent), transparent 75%); opacity: .55; animation: aura 2s ease-in-out infinite;
    }
    .go .aura { opacity: .95; }
    @keyframes aura { 50% { transform: scale(1.12); } }
    .turtle {
      position: absolute; left: calc(var(--cx) - 42px); top: var(--y);
      width: 84px; height: 111px; filter: drop-shadow(0 1.5px 2.5px rgba(0,0,0,.4));
    }
    .turtle svg { overflow: visible; display: block; }

    /* ---- Caminata: el cuerpo avanza ondulando y las patas van en diagonal (FL+BR / FR+BL). ---- */
    .body { transform-origin: 28px 40px; animation: sway var(--step) ease-in-out infinite; }
    .head { transform-origin: 28px 14px; animation: nod var(--step) ease-in-out infinite; }
    .tail { transform-origin: 28px 66px; animation: wag var(--step) ease-in-out infinite; }
    .leg { animation: var(--k) var(--step) ease-in-out infinite; }
    .fl { --k: legL; transform-origin: 16px 27px; }
    .br { --k: legR; transform-origin: 38px 56px; }
    .fr { --k: legR; transform-origin: 40px 27px; }
    .bl { --k: legL; transform-origin: 18px 56px; animation-delay: calc(var(--step) * -.5); }
    .br { animation-delay: calc(var(--step) * -.5); }
    @keyframes legL { 0%,100% { transform: translateY(-3.2px) rotate(-14deg); } 50% { transform: translateY(3.2px) rotate(14deg); } }
    @keyframes legR { 0%,100% { transform: translateY(3.2px) rotate(-14deg); } 50% { transform: translateY(-3.2px) rotate(14deg); } }
    @keyframes sway { 0%,100% { transform: rotate(-2deg) translateY(0); } 25% { transform: rotate(0) translateY(-.5px); } 50% { transform: rotate(2deg) translateY(0); } 75% { transform: rotate(0) translateY(-.5px); } }
    @keyframes nod { 0%,100% { transform: rotate(3deg) translateY(.6px); } 50% { transform: rotate(-3deg) translateY(-.6px); } }
    @keyframes wag { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-10deg); } }

    /* Polvo y líneas de velocidad (solo mientras avanza). */
    .fx { position: absolute; left: calc(var(--cx) - 30px); top: calc(var(--y) + 100px); width: 60px; height: 30px; opacity: 0; transition: opacity .25s; pointer-events: none; }
    .go .fx { opacity: 1; }
    .fx i { position: absolute; border-radius: 50%; background: rgba(255,240,215,.55); animation: puff .6s ease-out infinite; }
    .fx i:nth-child(1) { left: 12px; top: 0; width: 7px; height: 7px; }
    .fx i:nth-child(2) { left: 40px; top: 2px; width: 6px; height: 6px; animation-delay: -.2s; }
    .fx i:nth-child(3) { left: 26px; top: 0; width: 9px; height: 9px; animation-delay: -.4s; }
    @keyframes puff { 0% { transform: translateY(0) scale(.5); opacity: .9; } 100% { transform: translateY(18px) scale(1.8); opacity: 0; } }
    .lines { position: absolute; left: calc(var(--cx) - 46px); top: calc(var(--y) + 20px); width: 92px; height: 90px; opacity: 0; transition: opacity .25s; pointer-events: none; }
    .go .lines { opacity: 1; }
    .lines i { position: absolute; width: 1.4px; height: 22px; border-radius: 1px; background: linear-gradient(180deg, transparent, var(--gl)); animation: streak .5s linear infinite; }
    .lines i:nth-child(1) { left: 2px; top: 10px; } .lines i:nth-child(2) { left: 88px; top: 20px; animation-delay: -.15s; }
    .lines i:nth-child(3) { left: 10px; top: 44px; animation-delay: -.3s; } .lines i:nth-child(4) { left: 80px; top: 50px; animation-delay: -.1s; }
    @keyframes streak { from { transform: translateY(-24px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(40px); opacity: 0; } }

    /* Estrella de líder sobre la tortuga. */
    .lead { position: absolute; left: calc(var(--cx) - 8px); top: calc(var(--y) - 14px); width: 16px; height: 16px; opacity: 0; transform: scale(.3); transition: opacity .3s, transform .4s cubic-bezier(.2,1.6,.4,1); filter: drop-shadow(0 0 4px #ffd84d); }
    .racer.leader .lead { opacity: 1; transform: scale(1); animation: bob 1.1s ease-in-out infinite; }
    @keyframes bob { 50% { translate: 0 -2px; } }

    /* ---- Regalo: la tortuga crece (--sc), come cada regalo y corre gigante a la meta con el avatar del donante. ---- */
    .racer { --sc: 1; transform: scale(var(--sc)); transform-origin: var(--cx) calc(var(--y) + 18px);
      transition: --p 1.3s cubic-bezier(.3,.7,.3,1), --sc .7s cubic-bezier(.2,1.8,.4,1); }
    .mouth { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); }
    .racer.munch .mouth { animation: mouth .22s ease-in-out 3; }
    .racer.munch .head { animation: chomp .22s ease-in-out 3; }
    @keyframes mouth { 0%,100% { transform: scaleY(0); } 50% { transform: scaleY(1); } }
    @keyframes chomp { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    .racer.giant .aura { opacity: .95; background: radial-gradient(closest-side, rgba(255,216,77,.55), transparent 75%); }
    .racer.giant .turtle { filter: drop-shadow(0 0 4px #ffd84d) drop-shadow(0 1.5px 2.5px rgba(0,0,0,.4)); }
    .racer.arrive .turtle { animation: hop .5s ease-in-out 3; }
    @keyframes hop { 50% { transform: translateY(-4px); } }
    .rider { position: absolute; left: calc(var(--cx) - 15px); top: calc(var(--y) + 45px); width: 30px; height: 30px; opacity: 0; transform: scale(.2);
      transition: opacity .3s, transform .5s cubic-bezier(.2,1.8,.4,1); pointer-events: none; }
    .racer.riding .rider { opacity: 1; transform: scale(1); }
    .rider .av { width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box; border: 2.2px solid #ffd84d; overflow: hidden; position: relative;
      background: var(--bg, #555); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px;
      box-shadow: 0 0 8px #ffd84d, 0 2px 4px rgba(0,0,0,.6); }
    .rider .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .rider .nm { position: absolute; left: 50%; top: 31px; transform: translateX(-50%); white-space: nowrap; max-width: 60px; overflow: hidden; text-overflow: ellipsis;
      padding: 0 4px; border-radius: 6px; background: rgba(20,11,4,.9); border: 1px solid #ffd84d; color: #ffe98a; font-size: 6px; line-height: 9px; }
    @media (prefers-reduced-motion: reduce) { .body, .head, .tail, .leg, .aura, .fx i, .lines i { animation: none; } }
  </style>
</head>
<body data-team="1">
  <div class="board">
    <div class="racer" id="racer">
      <div class="shadow"></div>
      <div class="aura"></div>
      <div class="lines"><i></i><i></i><i></i><i></i></div>
      <div class="fx"><i></i><i></i><i></i></div>
      <div class="turtle"><svg viewBox="0 0 56 74" width="84" height="111">
      <defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd6de"/></linearGradient><clipPath id="hx"><polygon points="28,17 43,26 43,54 28,63 13,54 13,26"/></clipPath></defs>
      <g stroke="#1e3a8a" stroke-width="1.1">
        <g class="tail"><ellipse cx="28" cy="71" rx="3" ry="3.5" fill="#84cc16"/></g>
        <g class="leg fl"><ellipse cx="8" cy="24" rx="6" ry="8" transform="rotate(-25 8 24)" fill="#a3e635"/></g>
        <g class="leg fr"><ellipse cx="48" cy="24" rx="6" ry="8" transform="rotate(25 48 24)" fill="#a3e635"/></g>
        <g class="leg bl"><ellipse cx="10" cy="58" rx="6" ry="8" transform="rotate(25 10 58)" fill="#a3e635"/></g>
        <g class="leg br"><ellipse cx="46" cy="58" rx="6" ry="8" transform="rotate(-25 46 58)" fill="#a3e635"/></g>
      </g>
      <g class="head">
        <circle cx="28" cy="9" r="8" fill="#a3e635" stroke="#1e3a8a" stroke-width="1.1"/>
        <path d="M23.5 9q2 1.8 4 0M28.5 9q2 1.8 4 0" stroke="#3f6212" stroke-width="1" fill="none" stroke-linecap="round"/>
        <ellipse class="mouth" cx="28" cy="13.5" rx="3.2" ry="2.6" fill="#7f1d1d"/>
        <circle cx="22.5" cy="12.5" r="1.8" fill="#fb923c" opacity=".55"/><circle cx="33.5" cy="12.5" r="1.8" fill="#fb923c" opacity=".55"/>
      </g>
      <g class="body">
      <ellipse cx="28" cy="40" rx="21" ry="27" fill="url(#sh)" stroke="#1e3a8a" stroke-width="1.2"/>
      <ellipse cx="28" cy="40" rx="19" ry="25.5" fill="none" stroke="#16a34a" stroke-width="1.6"/>
      <polygon points="28,17 43,26 43,54 28,63 13,54 13,26" fill="#fff"/>
      <rect x="12" y="34" width="32" height="12" fill="#111" clip-path="url(#hx)"/><circle cx="28" cy="40" r="5.6" fill="#ececec" stroke="#111" stroke-width="1"/><path d="M28 35v10M23 40h10" stroke="#111" stroke-width=".8"/>
      <polygon points="28,17 43,26 43,54 28,63 13,54 13,26" fill="none" stroke="#1e3a8a" stroke-width="1"/>
      </g>
    </svg></div>
    <div class="rider"><div class="av" id="rider-av"></div><span class="nm" id="rider-nm"></span></div>
    <svg class="lead" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7Z" fill="#ffd84d" stroke="#b9770e" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <script src="/layers/game-core.js"></script>
  <script src="/layers/turtle-controller.js"></script>
</body>
</html>
