<!--
Archivo: layers/meta.html
Propósito: línea de llegada (franja a cuadros), rótulo META y contadores del equipo (comentarios, compartidos, likes y regalos).
Debe respetar:
- ubicarse al final de la pista (arriba, 100 m)
- ser un elemento visual limpio y claro
- no ocultar tortugas ni banderas
- los contadores salen de TortuGame.stats() (usuarios asignados a un solo equipo)
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif;
      font-weight: 900;
    }
    /* Alargue de la pista: index.html fija --ext (px de tablero) según las partes ocultas. */
    @property --ext { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --hdr { syntax: '<length>'; inherits: true; initial-value: 0px; }
    :root { transition: --ext .35s ease, --hdr .35s ease; }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board {
      position: absolute;
      left: 0;
      top: 0;
      width: 316px;
      height: 562px;
      transform: scale(3.417722);
      transform-origin: 0 0;
    }

    .m { position: absolute; left: 0; top: 0; }
    .m > * { position: absolute; }
    .glow {
      left: calc(var(--x) + 10px); top: calc(150px - var(--ext)); width: 117px; height: 26px;
      background: linear-gradient(180deg, rgba(240,176,40,.32), transparent);
    }
    .chk {
      left: calc(var(--x) + 10px); top: calc(145px - var(--ext)); width: 117px; height: 7px; border-radius: 3px 3px 0 0;
      background: conic-gradient(#fff 25%, #111 0 50%, #fff 0 75%, #111 0) 0 0 / 7px 7px;
    }
    .stats { position: absolute; left: calc(var(--x) + 10px); top: calc(183px - var(--ext)); width: 117px; display: flex; gap: 2px; transition: opacity .3s; }
    .chip { flex: 1; height: 12px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 1.5px; padding: 0 1px;
      border: 1px solid var(--c); border-radius: 6px; background: rgba(20,11,4,.92); box-shadow: 0 1px 2px rgba(0,0,0,.6), 0 0 4px color-mix(in srgb, var(--c) 50%, transparent); }
    .chip svg { width: 8px; height: 8px; flex: none; display: block; }
    .chip b { color: #fff; font-size: 6.5px; line-height: 8px; -webkit-text-stroke: .2px #000; }
    .chip.pop { animation: pop .35s ease-out; }
    @keyframes pop { 40% { transform: scale(1.4); } }
    .txt {
      left: calc(var(--x) + 10px); width: 112px; top: calc(153px - var(--ext)); text-align: right;
      font-size: 12.5px; line-height: 14px; font-style: italic; letter-spacing: 1.5px;
      color: #f7c948; -webkit-text-stroke: .5px #5a3a05;
      text-shadow: 0 1px 2px rgba(0,0,0,.7), 0 0 6px rgba(251,191,36,.55);
    }
  </style>
</head>
<body>
  <div class="board">
    <div class="m" style="--x:10px">
      <i class="glow"></i><i class="chk"></i><span class="txt">META</span>
    </div>
    <div class="m" style="--x:169px">
      <i class="glow"></i><i class="chk"></i><span class="txt">META</span>
    </div>
    <div class="stats" id="stats-0" style="--x:10px"></div>
    <div class="stats" id="stats-1" style="--x:169px"></div>
  </div>
  <script src="/layers/game-core.js"></script>
  <script>
    (function () {
      var ICONS = {
        comment: ['#5bd6ff', '<svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" fill="#5bd6ff" stroke="#0b5a78" stroke-width="1.4" stroke-linejoin="round"/></svg>'],
        share: ['#7dff9a', '<svg viewBox="0 0 24 24"><path d="M14 3l8 7-8 7v-4.2C8 12.8 4.5 14.8 2 19c.8-6.2 4.4-10 12-10.6Z" fill="#7dff9a" stroke="#0d6b2a" stroke-width="1.4" stroke-linejoin="round"/></svg>'],
        like: ['#ff4d6d', '<svg viewBox="0 0 24 24"><path d="M12 21C5 15.6 2 12.2 2 8.4A5.2 5.2 0 0 1 7.3 3.2c2 0 3.6 1 4.7 2.7 1.1-1.7 2.7-2.7 4.7-2.7A5.2 5.2 0 0 1 22 8.4c0 3.8-3 7.2-10 12.6Z" fill="#ff4d6d" stroke="#7a0f26" stroke-width="1.4" stroke-linejoin="round"/></svg>'],
        gift: ['#ffd84d', '<svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="11" rx="1.5" fill="#ffd84d" stroke="#8a5a10" stroke-width="1.3"/><rect x="2" y="7" width="20" height="4.5" rx="1.2" fill="#ffe98a" stroke="#8a5a10" stroke-width="1.3"/><path d="M12 7v14" stroke="#e11d48" stroke-width="2.6"/></svg>']
      };
      var nums = [{}, {}], last = [{}, {}];
      [0, 1].forEach(function (t) {
        var box = document.getElementById('stats-' + t);
        Object.keys(ICONS).forEach(function (k) {
          var chip = document.createElement('div'); chip.className = 'chip'; chip.style.setProperty('--c', ICONS[k][0]);
          chip.innerHTML = ICONS[k][1] + '<b>0</b>'; box.appendChild(chip); nums[t][k] = chip;
        });
      });
      function fmt(n) { return n >= 10000 ? Math.round(n / 1000) + 'k' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
      TortuGame.onStats(function (tot) {
        [0, 1].forEach(function (t) {
          Object.keys(ICONS).forEach(function (k) {
            var v = tot[t][k], chip = nums[t][k];
            if (last[t][k] === v) return;
            chip.querySelector('b').textContent = fmt(v);
            if (last[t][k] !== undefined && v > last[t][k]) { chip.classList.remove('pop'); void chip.offsetWidth; chip.classList.add('pop'); }
            last[t][k] = v;
          });
        });
      });
      window.addEventListener('message', function (event) {
        if (event.origin !== location.origin || event.data?.channel !== 'tortulive') return;
        var m = event.data.message, st = m?.type === 'snapshot' ? m.state?.displaySettings : m?.type === 'display_settings' ? m.settings : null;
        if (st) document.querySelectorAll('.stats').forEach(function (e) { e.style.opacity = st.teamEvents === false ? 0 : 1; });
      });
    })();
  </script>
</body>
</html>
