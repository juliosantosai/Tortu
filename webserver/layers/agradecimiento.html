<!--
Archivo: layers/agradecimiento.html
Propósito: placa de agradecimiento (oculta por defecto; .is-visible la muestra).
Debe respetar:
- ser una frase o bloque visual breve
- mantenerse en una zona baja y limpia del overlay
- sin funcionalidad ni interacción
- no repetir mensajes de alertas ni eventos
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif;
      font-weight: 900;
    }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board {
      position: absolute;
      left: 0;
      top: 0;
      width: 316px;
      height: 562px;
      transform: scale(3.417722);
      transform-origin: 0 0;
    }

    .thanks {
      position: absolute; left: 83px; top: 478px; width: 150px; height: 20px; box-sizing: border-box;
      border: 1.5px solid #f2c230; border-radius: 10px; background: linear-gradient(180deg, #3a2208, #1b1004);
      display: flex; align-items: center; justify-content: center;
      color: #f7c948; font-size: 9px; letter-spacing: 1px; text-shadow: 0 1px 1px #000;
      box-shadow: 0 2px 6px rgba(0,0,0,.5); opacity: 0; transition: opacity .3s;
    }
    .thanks.is-visible { opacity: 1; }
  </style>
</head>
<body>
  <div class="board">
    <div class="thanks" id="honor">🙏 GRACIAS</div>
  </div>
</body>
</html>
