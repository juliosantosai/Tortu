<!--
Archivo: layers/contadores.html
Propósito: contador de EVENTOS de cada equipo en el pie de su tarjeta.
Debe respetar:
- mostrar números o indicadores visuales
- no contener JS ni lógica de cálculo
- ser limpio y legible sobre el overlay
- no superponer el área central de juego
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif;
      font-weight: 900;
    }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board {
      position: absolute;
      left: 0;
      top: 0;
      width: 316px;
      height: 562px;
      transform: scale(3.417722);
      transform-origin: 0 0;
    }

    .ev {
      position: absolute; top: 536px; width: 141px; height: 17px; box-sizing: border-box;
      border: 1.5px solid #c99b3b; border-radius: 8px; background: #211308;
      display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 6px;
      box-shadow: inset 0 0 4px rgba(0,0,0,.7);
    }
    .k { color: #fff; font-size: 6.5px; letter-spacing: .3px; }
    .v { color: #f5c542; font-size: 9px; }
  </style>
</head>
<body>
  <div class="board">
    <div class="ev" style="left:8px"><span class="k">EVENTOS</span><span class="v" id="eventos-1">0</span></div>
    <div class="ev" style="left:167px"><span class="k">EVENTOS</span><span class="v" id="eventos-2">0</span></div>
  </div>
</body>
</html>
