<!--
Archivo: layers/regalos.html
Propósito: REGALO EXPLOSIVO. Cuando entra un regalo (evento "gift"):
  1. el regalo sale disparado hasta el techo y explota,
  2. cae sobre la tortuga de su equipo, que se lo come y CRECE (cada regalo = más grande),
  3. cuando ya no quedan regalos, la tortuga gigante corre a la META con el avatar de quien regaló,
  4. al llegar (fx "arrive") el equipo REALMENTE llega a la meta (100 m) y gana: game-core.js de cada capa
     escucha ese aviso y fija el progreso en la meta; después la tortuga vuelve a su tamaño normal, ya en la meta.
Esta capa dirige la coreografía y manda órdenes a tortuga-1/2 (canal "tortulive-fx").
Probar: clic en la esquina superior derecha del overlay (simula un regalo).
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif; font-weight: 900; }
    .board { position: absolute; left: 0; top: 0; width: 316px; height: 562px; transform: scale(3.417722); transform-origin: 0 0; }
    .gift { position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; will-change: transform; filter: drop-shadow(0 0 5px #ffd84d); }
    .gift svg { display: block; width: 100%; height: 100%; }
    .p { position: absolute; pointer-events: none; will-change: transform, opacity; }
    .ring { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid #ffd84d; pointer-events: none; }
    .flash { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
      background: radial-gradient(circle, #fff, rgba(255,216,77,.8) 40%, transparent 70%); pointer-events: none; }
    .ribbon { position: absolute; width: 112px; height: 18px; margin-left: -56px; box-sizing: border-box; border: 1.5px solid #ffd84d; border-radius: 9px;
      background: linear-gradient(180deg, #7a1230, #3a0716); color: #ffe98a; font-size: 10px; line-height: 15px; text-align: center; letter-spacing: 1px;
      box-shadow: 0 0 10px #ffd84d, 0 2px 5px rgba(0,0,0,.6); opacity: 0; }
  </style>
</head>
<body>
  <div class="board" id="board"></div>
  <script src="/layers/game-core.js"></script>
  <script>
    (function () {
      'use strict';
      var board = document.getElementById('board');
      var CX = [78.5, 237.5], CEIL = 6, MAX_UNITS = 4;
      var COLORS = ['#ffd84d', '#ff4d6d', '#5bd6ff', '#7dff9a', '#ff7ad9', '#fb923c', '#fff'];
      var GIFT_SVG = '<svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="11" rx="1.5" fill="#ffd84d" stroke="#8a5a10" stroke-width="1.3"/><rect x="2" y="7" width="20" height="4.5" rx="1.2" fill="#ffe98a" stroke="#8a5a10" stroke-width="1.3"/><path d="M12 7v14" stroke="#e11d48" stroke-width="2.6"/><path d="M12 7C9 7 7.5 3 10 3c1.6 0 2 2.4 2 4ZM12 7c3 0 4.5-4 2-4-1.6 0-2 2.4-2 4Z" fill="#e11d48"/></svg>';
      var q = [[], []], busy = [false, false], eaten = [0, 0], scale = [1, 1], lastSeq = 0;

      function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
      function rnd(a, b) { return a + Math.random() * (b - a); }
      function hash(str) { var h = 0; for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h); }
      function pick(o, keys) { for (var i = 0; i < keys.length; i++) if (o[keys[i]] != null && o[keys[i]] !== '') return o[keys[i]]; return null; }
      function ext() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ext')) || 0; }
      function send(msg) {
        msg.channel = 'tortulive-fx';
        try { for (var i = 0; i < window.parent.length; i++) window.parent.frames[i].postMessage(msg, location.origin); } catch (e) { /* */ }
      }
      function scaleFor(n) { return Math.min(2, 1.3 + 0.2 * n); }
      function mouth(t) {
        var y = 415 - TortuGame.get().teams[t].p * (275.5 + ext());
        return { x: CX[t], y: y + 18 + 3 * scale[t] };
      }

      // Mismo reparto de equipo que eventos-ruta.html.
      function teamOf(ev, user) {
        var known = TortuGame.userTeam(user); if (known > -1) return known;
        var v = pick(ev, ['team', 'teamId', 'equipo', 'side', 'teamIndex']);
        if (v === 1 || v === '1' || v === 'team1') return 0;
        if (v === 2 || v === '2' || v === 'team2') return 1;
        if (typeof v === 'string') {
          var st = TortuGame.get(), u = v.toUpperCase();
          if (u === st.teams[0].name) return 0;
          if (u === st.teams[1].name) return 1;
        }
        return hash(String(user || Math.random())) % 2;
      }

      /* ---- Efectos ---- */
      function burst(x, y, n, big) {
        var f = document.createElement('i'); f.className = 'flash'; f.style.left = x + 'px'; f.style.top = y + 'px'; board.appendChild(f);
        f.animate([{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(' + (big ? 4 : 2.6) + ')', opacity: 0 }], { duration: 450, easing: 'ease-out' }).onfinish = function () { f.remove(); };
        var r = document.createElement('i'); r.className = 'ring'; r.style.left = x + 'px'; r.style.top = y + 'px'; board.appendChild(r);
        r.animate([{ transform: 'scale(.3)', opacity: 1 }, { transform: 'scale(' + (big ? 9 : 6) + ')', opacity: 0 }], { duration: 650, easing: 'ease-out' }).onfinish = function () { r.remove(); };
        for (var i = 0; i < n; i++) {
          var c = document.createElement('i'), a = Math.random() * 6.283, d = rnd(12, big ? 60 : 38), s = rnd(2, 4.5);
          c.className = 'p'; c.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + s + 'px;height:' + (i % 2 ? s : s * 1.8) + 'px;background:' + COLORS[i % COLORS.length] + ';border-radius:' + (i % 3 ? '1px' : '50%');
          board.appendChild(c);
          var dx = Math.cos(a) * d, dy = Math.sin(a) * d;
          c.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 },
            { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rnd(-360, 360) + 'deg)', opacity: 1, offset: .6 },
            { transform: 'translate(' + dx * 1.15 + 'px,' + (dy + 26) + 'px) rotate(' + rnd(-540, 540) + 'deg)', opacity: 0 }],
            { duration: rnd(700, 1100), easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = (function (el) { return function () { el.remove(); }; })(c);
        }
      }
      function confettiRain(cx) {
        for (var i = 0; i < 36; i++) {
          (function (i) {
            setTimeout(function () {
              var c = document.createElement('i'), x = cx + rnd(-62, 62), s = rnd(2, 4);
              c.className = 'p'; c.style.cssText = 'left:' + x + 'px;top:100px;width:' + s + 'px;height:' + s * 1.7 + 'px;background:' + COLORS[i % COLORS.length];
              board.appendChild(c);
              c.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: 'translate(' + rnd(-16, 16) + 'px,150px) rotate(' + rnd(-720, 720) + 'deg)', opacity: 0 }],
                { duration: rnd(1300, 2000), easing: 'ease-in' }).onfinish = function () { c.remove(); };
            }, i * 30);
          })(i);
        }
      }
      function ribbon(cx, text) {
        var el = document.createElement('div'); el.className = 'ribbon'; el.style.left = cx + 'px'; el.style.top = '112px'; el.textContent = text; board.appendChild(el);
        el.animate([{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1.2)', offset: .15 }, { opacity: 1, transform: 'scale(1)', offset: .25 }, { opacity: 1, offset: .85 }, { opacity: 0, transform: 'scale(.9)' }],
          { duration: 2400 }).onfinish = function () { el.remove(); };
      }

      // Anima u: 0 -> 1 durante ms con rAF.
      function tween(ms, fn) {
        return new Promise(function (res) {
          var t0 = performance.now();
          (function step(now) {
            var u = Math.min(1, (now - t0) / ms); fn(u);
            if (u < 1) requestAnimationFrame(step); else res();
          })(t0);
        });
      }
      function trail(x, y) {
        var c = document.createElement('i'), s = rnd(1.5, 3);
        c.className = 'p'; c.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + s + 'px;height:' + s + 'px;border-radius:50%;background:' + COLORS[(Math.random() * 4) | 0] + ';box-shadow:0 0 4px #ffd84d';
        board.appendChild(c);
        c.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: 'translate(' + rnd(-6, 6) + 'px,' + rnd(4, 12) + 'px) scale(0)', opacity: 0 }], { duration: 450 }).onfinish = function () { c.remove(); };
      }

      /* ---- Un regalo: sube al techo, explota, cae y la tortuga se lo come ---- */
      async function flyGift(t) {
        var g = document.createElement('div'); g.className = 'gift'; g.innerHTML = GIFT_SVG; board.appendChild(g);
        var x0 = CX[t] + rnd(-24, 24), y0 = 470, xTop = CX[t] + rnd(-34, 34), rot = rnd(300, 600), tr = 0;
        var cur = { x: x0, y: y0 };
        await tween(1000, function (u) {
          var e = 1 - Math.pow(1 - u, 3);
          cur.x = x0 + (xTop - x0) * e + Math.sin(u * 14) * 2; cur.y = y0 + (CEIL - y0) * e;
          g.style.transform = 'translate(' + cur.x + 'px,' + cur.y + 'px) rotate(' + rot * u + 'deg) scale(' + (1 + u * .4) + ')';
          if ((tr += 1) % 3 === 0) trail(cur.x, cur.y + 8);
        });
        burst(cur.x, CEIL + 4, 14, false);              // explosión en el techo
        await delay(120);
        var xs = cur.x;
        await tween(900, function (u) {
          var m = mouth(t), e = u * u;
          cur.x = xs + (m.x - xs) * e; cur.y = CEIL + (m.y - CEIL) * e;
          g.style.transform = 'translate(' + cur.x + 'px,' + cur.y + 'px) rotate(' + (rot + 200 * u) + 'deg) scale(' + (1.4 - u * .5) + ')';
          if ((tr += 1) % 2 === 0) trail(cur.x, cur.y - 6);
        });
        g.remove();
        var m = mouth(t);
        burst(m.x, m.y, 18, true);                      // ¡ñam! explota en la boca
        eaten[t] += 1; scale[t] = scaleFor(eaten[t]);
        send({ fx: 'eat', team: t, scale: scale[t] });
        await delay(260);
      }

      /* ---- La tortuga gigante corre a la meta con el avatar del donante ---- */
      async function runToGoal(t, g) {
        var sc = scale[t], span = 275.5 + ext();
        var pEnd = Math.max(TortuGame.get().teams[t].p, 1 - (18 * (sc - 1)) / span);
        send({ fx: 'run', team: t, user: g.user, avatar: g.avatar, pEnd: pEnd });
        await delay(2750);
        send({ fx: 'arrive', team: t });
        burst(CX[t], 142, 30, true); confettiRain(CX[t]); ribbon(CX[t], '¡META!');
        await delay(2600);
        send({ fx: 'end', team: t });
        eaten[t] = 0; scale[t] = 1;
        await delay(1900);
      }

      async function pump(t) {
        if (busy[t]) return; busy[t] = true;
        try {
          while (q[t].length) {
            var last = null;
            while (q[t].length) {                        // alimentar: cada regalo vuela, cae y se come
              var g = q[t].shift(); last = g;
              var units = Math.min(g.count, MAX_UNITS), ps = [];
              for (var i = 0; i < units; i++) ps.push(delay(i * 420).then(function () { return flyGift(t); }));
              await Promise.all(ps);
            }
            await delay(450);
            if (q[t].length) continue;                   // llegaron más regalos: seguir comiendo
            await runToGoal(t, last);
          }
        } catch (e) { console.error(e); eaten[t] = 0; scale[t] = 1; send({ fx: 'end', team: t }); }
        busy[t] = false;
      }

      function handle(ev) {
        if (ev.event !== 'gift') return;
        var user = pick(ev, ['user', 'username', 'nickname', 'uniqueId', 'name']) || '?';
        var avatar = pick(ev, ['avatar', 'avatarUrl', 'profilePictureUrl', 'profilePicture', 'picture', 'image', 'photo']);
        var n = parseInt(pick(ev, ['count', 'amount', 'quantity', 'repeatCount']), 10);
        if (!(n > 0)) n = 1;
        var t = teamOf(ev, user);
        q[t].push({ user: user, avatar: avatar, count: n });
        pump(t);
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== location.origin || !event.data || event.data.channel !== 'tortulive') return;
        var m = event.data.message;
        if (!m || m.type !== 'event') return;
        var seq = Number(m.sequence);
        if (isFinite(seq) && seq > 0) { if (seq <= lastSeq) return; lastSeq = seq; }
        handle(m);
      });
      window.TortuRegalos = { handle: handle };
    })();
  </script>
</body>
</html>
