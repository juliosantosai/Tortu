<!--
Archivo: layers/eventos-ruta.html
Propósito: EVENTOS GAMIFICADOS sobre la vía de cada equipo. Cada evento sale como una burbuja de
diálogo en un punto al azar del carril, con el avatar del usuario:
  - comentario  -> avatar + icono de mensaje (solo icono, sin texto)
  - se une      -> avatar + bandera del equipo
  - comparte    -> avatar + icono de compartir
  - te sigue    -> avatar + icono de seguidor (+)
  - like        -> avatar + corazón con la cantidad (xN)  (los likes seguidos se acumulan)
  - regalo      -> avatar + regalo con la cantidad
Equipo: se toma del evento (team / teamId / equipo = 1|2|nombre); si no viene, se reparte de forma
estable por nombre de usuario. Avatar: avatar / avatarUrl / profilePictureUrl...; si no hay imagen
se usa un círculo de color con la inicial.
Probar sin datos: añade ?demo=1 a la URL del overlay.
Debe respetar:
- ir sobre las tortugas pero sin tapar banderas ni encabezado
- ser decorativa y breve (cada burbuja dura ~3 s)
Sonido: cada evento avisa al overlay padre (canal tortulive-sound) con usuario, texto del comentario y cantidad;
  el padre (event-sounds.js) suma XP/combos y lee los comentarios con voz.
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif; font-weight: 900;
    }
    @property --ext { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --hdr { syntax: '<length>'; inherits: true; initial-value: 0px; }
    :root { transition: --ext .35s ease, --hdr .35s ease; }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board { position: absolute; left: 0; top: 0; width: 316px; height: 562px; transform: scale(3.417722); transform-origin: 0 0; }
    .lane { position: absolute; top: 0; width: 145px; height: 562px; overflow: visible; }
    .lane.l { left: 6px; } .lane.r { left: 165px; }

    /* ---- Burbuja de diálogo ---- */
    .ev {
      position: absolute; display: flex; align-items: center; gap: 5px; height: 32px; box-sizing: border-box;
      padding: 2px 8px 2px 3px; border-radius: 24px; border: 1.5px solid var(--c);
      background: linear-gradient(180deg, rgba(58,34,12,.96), rgba(20,11,4,.96));
      box-shadow: 0 2px 5px rgba(0,0,0,.6), 0 0 8px var(--c), inset 0 0 5px color-mix(in srgb, var(--c) 40%, transparent);
      transform-origin: 14% 100%; opacity: 0; animation: life var(--life, 3.2s) cubic-bezier(.3,1,.4,1) forwards;
      white-space: nowrap; will-change: transform, opacity;
    }
    /* Cola del globo de diálogo. */
    .ev::after {
      content: ''; position: absolute; left: 9px; bottom: -5px; width: 6px; height: 6px; box-sizing: border-box;
      background: rgba(20,11,4,.96); border-right: 1.5px solid var(--c); border-bottom: 1.5px solid var(--c); transform: rotate(45deg) skew(8deg, 8deg);
    }
    .av {
      position: relative; width: 26px; height: 26px; border-radius: 50%; box-sizing: border-box; flex: none; overflow: hidden;
      border: 1.3px solid var(--c); background: var(--bg, #555); display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; line-height: 1; text-shadow: 0 1px 1px #000;
    }
    .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ic { width: 26px; height: 26px; flex: none; display: block; filter: drop-shadow(0 0 2px var(--c)); animation: icwig .55s ease-in-out .3s 3; transform-origin: 50% 60%; }
    .ic.flag { width: 14px; height: 10px; border-radius: 1.5px; overflow: hidden; border: .8px solid #fbf6ea; box-shadow: 0 1px 2px rgba(0,0,0,.6); }
    .ic.flag svg { display: block; width: 100%; height: 100%; }
    .num { color: #fff; font-size: 14px; line-height: 18px; letter-spacing: .3px; -webkit-text-stroke: .3px #000; text-shadow: 0 1px 1px #000, 0 0 4px var(--c); }
    .num b { color: var(--c); font-size: 11px; margin-right: .5px; }

    /* Tipos. */
    .ev.comment { --c: #5bd6ff; } .ev.share { --c: #7dff9a; } .ev.follow { --c: #ff7ad9; }
    .ev.like { --c: #ff4d6d; } .ev.gift { --c: #ffd84d; } .ev.join { --c: var(--tc); }
    .ev.big { height: 36px; border-width: 2px; } .ev.big .av { width: 30px; height: 30px; } .ev.big .ic { width: 30px; height: 30px; }
    .ev.big .num { font-size: 16px; line-height: 20px; } .ev.big::after { left: 12px; }
    .ev.mega { height: 40px; --life: 4s; } .ev.mega .av { width: 34px; height: 34px; } .ev.mega .ic { width: 34px; height: 34px; } .ev.mega .num { font-size: 19px; line-height: 22px; }
    .ev.mega::after { left: 14px; }

    /* Animación: aparece con rebote, se mece, sube y se desvanece. */
    @keyframes life {
      0%   { opacity: 0; transform: translateY(8px) scale(.2) rotate(-8deg); }
      8%   { opacity: 1; transform: translateY(-2px) scale(1.25) rotate(3deg); }
      14%  { transform: translateY(0) scale(.95) rotate(-1deg); }
      20%  { transform: translateY(0) scale(1) rotate(0); }
      80%  { opacity: 1; transform: translateY(-5px) scale(1); }
      100% { opacity: 0; transform: translateY(-14px) scale(.85); }
    }
    @keyframes icwig { 0%,100% { transform: rotate(0) scale(1); } 30% { transform: rotate(-14deg) scale(1.25); } 70% { transform: rotate(14deg) scale(1.25); } }
    .ev.bump { animation: bump .35s cubic-bezier(.2,1.6,.4,1); }
    @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }

    /* Destellos al aparecer. */
    .spark { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--c); box-shadow: 0 0 4px 1px var(--c); animation: spark .7s ease-out forwards; pointer-events: none; }
    @keyframes spark { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
    .ring { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 1.5px solid var(--c); animation: ringp .7s ease-out forwards; pointer-events: none; }
    @keyframes ringp { from { transform: scale(.3); opacity: 1; } to { transform: scale(4.5); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ic { animation: none; } }
  </style>
</head>
<body>
  <div class="board">
    <div class="lane l" id="lane-0"></div>
    <div class="lane r" id="lane-1"></div>
  </div>
  <script src="/layers/game-core.js"></script>
  <script>
    (function () {
      'use strict';
      var lanes = [document.getElementById('lane-0'), document.getElementById('lane-1')];
      var TEAM_COLOR = ['#e2e8f0', '#5b8cff'];
      var FLAGS = [
        '<svg viewBox="0 0 56 41" preserveAspectRatio="none"><rect width="56" height="41" fill="#fff"/><rect y="12" width="56" height="17" fill="#111"/><circle cx="28" cy="20.5" r="10" fill="#e5e5e5" stroke="#111" stroke-width="2"/><path d="M28 14v13M21.5 20.5h13" stroke="#111" stroke-width="1.2"/></svg>',
        '<svg viewBox="0 0 56 41" preserveAspectRatio="none"><rect width="56" height="41" fill="#1f3f94"/><rect x="9.3" width="9.3" height="41" fill="#a01030"/><rect x="28" width="9.3" height="41" fill="#a01030"/><rect x="46.6" width="9.4" height="41" fill="#a01030"/><path d="M28 6 41 11V23Q41 32 28 37 15 32 15 23V11Z" fill="#1f3f94" stroke="#fff" stroke-width="1.6"/><circle cx="28" cy="20" r="5.6" fill="#e6eefc"/></svg>'
      ];
      var ICONS = {
        comment: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" fill="#5bd6ff" stroke="#0b5a78" stroke-width="1.4" stroke-linejoin="round"/><circle cx="8" cy="10.5" r="1.4" fill="#0b3a50"/><circle cx="12" cy="10.5" r="1.4" fill="#0b3a50"/><circle cx="16" cy="10.5" r="1.4" fill="#0b3a50"/></svg>',
        share: '<svg class="ic" viewBox="0 0 24 24"><path d="M14 3l8 7-8 7v-4.2C8 12.8 4.5 14.8 2 19c.8-6.2 4.4-10 12-10.6Z" fill="#7dff9a" stroke="#0d6b2a" stroke-width="1.4" stroke-linejoin="round"/></svg>',
        follow: '<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4.2" fill="#ff7ad9" stroke="#7a1a62" stroke-width="1.3"/><path d="M1.5 21c0-4.4 3.4-7 7.5-7s7.5 2.6 7.5 7Z" fill="#ff7ad9" stroke="#7a1a62" stroke-width="1.3" stroke-linejoin="round"/><path d="M19 6v7M15.5 9.5h7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
        like: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 21C5 15.6 2 12.2 2 8.4A5.2 5.2 0 0 1 7.3 3.2c2 0 3.6 1 4.7 2.7 1.1-1.7 2.7-2.7 4.7-2.7A5.2 5.2 0 0 1 22 8.4c0 3.8-3 7.2-10 12.6Z" fill="#ff4d6d" stroke="#7a0f26" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 8.2c.2-1.5 1.2-2.4 2.6-2.4" stroke="#fff" stroke-opacity=".8" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>',
        gift: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="11" rx="1.5" fill="#ffd84d" stroke="#8a5a10" stroke-width="1.3"/><rect x="2" y="7" width="20" height="4.5" rx="1.2" fill="#ffe98a" stroke="#8a5a10" stroke-width="1.3"/><path d="M12 7v14" stroke="#e11d48" stroke-width="2.6"/><path d="M12 7C9 7 7.5 3 10 3c1.6 0 2 2.4 2 4ZM12 7c3 0 4.500-4 2-4-1.6 0-2 2.400-2 4Z" fill="#e11d48"/></svg>'
      };
      var PALETTE = ['#e11d48', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#6366f1', '#a855f7', '#ec4899'];
      var active = [[], []];
      var lastSeq = 0, pendingLikes = [null, null];
      var MAX_ACTIVE = 7;

      function hash(str) { var h = 0; for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h); }
      function pick(o, keys) { for (var i = 0; i < keys.length; i++) if (o[keys[i]] != null && o[keys[i]] !== '') return o[keys[i]]; return null; }
      function playSound(kind, count, meta) {
        meta = meta || {};
        window.parent.postMessage({
          channel: 'tortulive-sound', kind: kind, count: count,
          user: meta.user, team: meta.team, text: meta.text, delta: meta.delta, bump: !!meta.bump
        }, location.origin);
      }

      function teamOf(ev, user) {
        var serverTeam = pick(ev, ['teamId']);
        if (serverTeam === 1 || serverTeam === '1' || serverTeam === 'team1') return 0;
        if (serverTeam === 2 || serverTeam === '2' || serverTeam === 'team2') return 1;
        var known = TortuGame.userTeam(user); if (known > -1) return known;
        var v = pick(ev, ['team', 'teamId', 'equipo', 'side', 'teamIndex']);
        if (v === 1 || v === '1' || v === 'team1') return 0;
        if (v === 2 || v === '2' || v === 'team2') return 1;
        if (typeof v === 'string') {
          var st = TortuGame.get(), u = v.toUpperCase();
          if (u === st.teams[0].name) return 0;
          if (u === st.teams[1].name) return 1;
        }
        return hash(String(user || Math.random())) % 2;
      }

      function safeUrl(u) { return typeof u === 'string' && /^(https:\/\/|data:image\/)/i.test(u) ? u : null; }

      function avatarEl(user, url) {
        var a = document.createElement('span'); a.className = 'av';
        var name = String(user || '?').replace(/^@/, '');
        a.style.setProperty('--bg', PALETTE[hash(name) % PALETTE.length]);
        a.textContent = (name[0] || '?').toUpperCase();
        var safe = safeUrl(url);
        if (safe) {
          var img = document.createElement('img'); img.alt = ''; img.referrerPolicy = 'no-referrer';
          img.onerror = function () { img.remove(); };
          img.src = safe; a.appendChild(img);
        }
        return a;
      }

      function laneBounds() {
        var ext = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ext')) || 0;
        return { top: 168 - ext, bottom: 488 };
      }

      function place(t, w) {
        var b = laneBounds(), best = null, bestD = -1;
        for (var k = 0; k < 10; k++) {
          var x = 17 + Math.random() * (127 - w - 17), y = b.top + Math.random() * (b.bottom - b.top);
          var d = 1e9;
          active[t].forEach(function (o) { d = Math.min(d, Math.hypot(o.x - x, (o.y - y) * 1.6)); });
          if (d > bestD) { bestD = d; best = { x: x, y: y }; }
        }
        return best;
      }

      function sparks(lane, x, y, color) {
        var r = document.createElement('i'); r.className = 'ring'; r.style.cssText = 'left:' + x + 'px;top:' + y + 'px;--c:' + color; lane.appendChild(r);
        setTimeout(function () { r.remove(); }, 800);
        for (var i = 0; i < 7; i++) {
          var s = document.createElement('i'), a = Math.random() * 6.283, d = 10 + Math.random() * 16;
          s.className = 'spark'; s.style.cssText = 'left:' + x + 'px;top:' + y + 'px;--c:' + color + ';--dx:' + (Math.cos(a) * d) + 'px;--dy:' + (Math.sin(a) * d) + 'px';
          lane.appendChild(s); setTimeout(function (el) { el.remove(); }.bind(null, s), 800);
        }
      }

      function show(kind, t, user, avatar, count, text) {
        var lane = lanes[t];
        if (active[t].length >= MAX_ACTIVE) { var old = active[t].shift(); old.el.remove(); }
        var el = document.createElement('div');
        var big = count >= 50 ? ' mega' : count >= 15 ? ' big' : '';
        el.className = 'ev ' + kind + big;
        el.style.setProperty('--tc', TEAM_COLOR[t]);
        el.appendChild(avatarEl(user, avatar));
        if (kind === 'join') {
          var f = document.createElement('span'); f.className = 'ic flag'; f.innerHTML = FLAGS[t]; el.appendChild(f);
        } else {
          el.insertAdjacentHTML('beforeend', ICONS[kind]);
        }
        var numEl = null;
        if ((kind === 'like' || kind === 'gift') && count > 0) {
          numEl = document.createElement('span'); numEl.className = 'num'; numEl.innerHTML = '<b>×</b>' + count; el.appendChild(numEl);
        }
        lane.appendChild(el);
        var w = el.offsetWidth || 44;
        var pos = place(t, w);
        el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px';
        var rec = { el: el, x: pos.x + w / 2, y: pos.y, kind: kind, user: user, count: count, num: numEl, at: Date.now() };
        active[t].push(rec);
        var c = getComputedStyle(el).getPropertyValue('--c').trim() || '#fff';
        sparks(lane, pos.x + 8, pos.y + 9, c);
        var teamName = (TortuGame.get().teams[t] || {}).name || '';
        playSound(kind, count, { user: user, team: teamName, text: text, delta: Math.max(1, count) });
        var life = (kind === 'like' && count >= 50 ? 4000 : 3200) + 150;
        setTimeout(function () { el.remove(); var i = active[t].indexOf(rec); if (i > -1) active[t].splice(i, 1); }, life);
        return rec;
      }

      // Los likes seguidos de un mismo usuario/equipo se acumulan en una sola burbuja (xN).
      function like(t, user, avatar, count) {
        var cur = pendingLikes[t];
        var now = Date.now();
        if (cur && cur.user === user && now - cur.at < 2200 && cur.rec.el.isConnected) {
          cur.total += count; cur.at = now;
          if (cur.rec.num) cur.rec.num.innerHTML = '<b>×</b>' + cur.total;
          cur.rec.el.classList.toggle('big', cur.total >= 15); cur.rec.el.classList.toggle('mega', cur.total >= 50);
          cur.rec.el.classList.remove('bump'); void cur.rec.el.offsetWidth; cur.rec.el.classList.add('bump');
          playSound('like', cur.total, { user: user, delta: count, bump: true });
          return;
        }
        var rec = show('like', t, user, avatar, count);
        pendingLikes[t] = { user: user, total: count, at: now, rec: rec };
      }

      function handle(ev) {
        var kind = ev.event;
        if (!ICONS[kind] && kind !== 'join') return;
        var user = pick(ev, ['user', 'username', 'nickname', 'uniqueId', 'name']) || '?';
        var avatar = pick(ev, ['avatar', 'avatarUrl', 'profilePictureUrl', 'profilePicture', 'picture', 'image', 'photo']);
        var t = teamOf(ev, user);
        var n = parseInt(pick(ev, ['count', 'likeCount', 'likes', 'amount', 'quantity', 'repeatCount']), 10);
        if (!(n > 0)) n = 1;
        if (kind === 'like') like(t, user, avatar, n);
        else show(kind, t, user, avatar, kind === 'gift' ? n : 0,
          kind === 'comment' ? pick(ev, ['message', 'text', 'comment', 'content']) : null);
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== location.origin || !event.data || event.data.channel !== 'tortulive') return;
        var m = event.data.message;
        if (!m || m.type !== 'event') return;
        var seq = Number(m.sequence);
        if (isFinite(seq) && seq > 0) { if (seq <= lastSeq) return; lastSeq = seq; }
        handle(m);
      });

      // ---- Demo: eventos simulados (?demo=1) ----
      if (TortuGame.demo) {
        var NAMES = ['maria_g', 'juanpi', 'lucho10', 'sofi.tv', 'carlitos', 'ana_lu', 'pepe77', 'valen', 'tortufan', 'dani_rg'];
        var KINDS = ['comment', 'comment', 'like', 'like', 'like', 'join', 'share', 'follow', 'gift'];
        setInterval(function () {
          var kind = KINDS[Math.floor(Math.random() * KINDS.length)];
          var n = kind === 'like' ? [1, 3, 5, 12, 25, 60][Math.floor(Math.random() * 6)] : kind === 'gift' ? 1 + Math.floor(Math.random() * 5) : 1;
          var st = TortuGame.get(), ev = { event: kind, user: NAMES[Math.floor(Math.random() * NAMES.length)], count: n };
          if (kind === 'join') ev.team = 1 + Math.floor(Math.random() * 2);       // equipo inicial
          if (kind === 'comment') ev.text = ['hola', 'vamos ' + st.teams[Math.floor(Math.random() * 2)].name.toLowerCase() + '!!', 'jajaja', 'arriba ' + st.teams[Math.floor(Math.random() * 2)].name.toLowerCase()][Math.floor(Math.random() * 4)];
          handle(ev);
        }, 650);
      }
      // Cambio de equipo: el usuario aparece con la bandera del equipo nuevo.
      TortuGame.onSwitch(function (sw) { show('join', sw.to, sw.user, sw.avatar, 0); });
      window.TortuEventos = { handle: handle };
    })();
  </script>
</body>
</html>
