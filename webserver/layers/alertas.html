<!--
Archivo: layers/alertas.html
Propósito: alerta de evento (comment, follow, share, like, gift, join, reset, winner).
Oculta por defecto como en el modelo; se muestra con la clase .is-visible.
Debe respetar:
- no interferir con la pista ni con la meta
- no incluir lógica de negocio ni JS
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif;
      font-weight: 900;
    }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board {
      position: absolute;
      left: 0;
      top: 0;
      width: 316px;
      height: 562px;
      transform: scale(3.417722);
      transform-origin: 0 0;
    }

    .event {
      position: absolute; left: 93px; top: 504px; width: 130px; height: 18px; box-sizing: border-box;
      border: 1.5px solid #c99b3b; border-radius: 9px; background: rgba(33,19,8,.92); color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      font-size: 7px; letter-spacing: .8px; text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(0,0,0,.5); opacity: 0; transition: opacity .25s;
    }
    .event.is-visible { opacity: 1; }
    .icon {
      width: 11px; height: 11px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #fbbf24, #f97316); font-size: 7px;
    }
  </style>
</head>
<body>
  <div class="board">
    <div class="event" id="alerta"><span class="icon">💬</span><span class="kind">comment</span></div>
  </div>
</body>
</html>
