<!--
Archivo: layers/don-tortu.html
Propósito: avatar de Don Tortu (tortuga con auriculares) en el centro del encabezado.
Debe respetar:
- ser una capa centrada y decorativa
- no competir visualmente con las tortugas
- no depender de JS ni de estado externo
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif;
      font-weight: 900;
    }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board {
      position: absolute;
      left: 0;
      top: 0;
      width: 316px;
      height: 562px;
      transform: scale(3.417722);
      transform-origin: 0 0;
    }

    .avatar { position: absolute; left: 121px; top: 16px; width: 74px; height: 74px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }

    /* Gestos: parpadeo, mirada y boca hablando (solo CSS, sin JS). */
    .lid { fill: #62d03c; transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); animation: blink 4.2s ease-in-out infinite; }
    .look { animation: look 7s ease-in-out infinite; }
    .m-smile { animation: m-smile 4.5s step-end infinite; }
    .m-s, .m-m, .m-l { opacity: 0; }
    .m-s { animation: m-s 4.5s step-end infinite; }
    .m-m { animation: m-m 4.5s step-end infinite; }
    .m-l { animation: m-l 4.5s step-end infinite; }
    @keyframes blink { 0%, 90% { transform: scaleY(0); } 94% { transform: scaleY(1); } 98%, 100% { transform: scaleY(0); } }
    @keyframes look {
      0%, 18% { transform: translate(0, 0); } 24%, 40% { transform: translate(-1.3px, .3px); }
      46%, 62% { transform: translate(1.3px, -.2px); } 70%, 100% { transform: translate(0, 0); }
    }
    /* 0-60 % habla (12 sílabas), 60-100 % descansa con la sonrisa. */
    @keyframes m-smile { 0% { opacity: 0; } 60% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes m-s { 0% { opacity: 1; } 5% { opacity: 0; } 20% { opacity: 1; } 25% { opacity: 0; } 35% { opacity: 1; } 40% { opacity: 0; } 55% { opacity: 1; } 60%, 100% { opacity: 0; } }
    @keyframes m-m { 0% { opacity: 0; } 10% { opacity: 1; } 15% { opacity: 0; } 30% { opacity: 1; } 35% { opacity: 0; } 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes m-l { 0% { opacity: 0; } 5% { opacity: 1; } 10% { opacity: 0; } 15% { opacity: 1; } 20% { opacity: 0; } 25% { opacity: 1; } 30% { opacity: 0; } 40% { opacity: 1; } 45% { opacity: 0; } 50% { opacity: 1; } 55%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .lid, .look, .m-smile, .m-s, .m-m, .m-l { animation: none; } }
  </style>
</head>
<body>
  <div class="board">
    <div class="avatar">
      <svg viewBox="0 0 74 74" width="74" height="74">
        <defs>
          <radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#7d4d26"/><stop offset="1" stop-color="#3a2211"/></radialGradient>
          <clipPath id="c"><circle cx="37" cy="37" r="32"/></clipPath>
        </defs>
        <circle cx="37" cy="37" r="35" fill="#ead7a8"/>
        <circle cx="37" cy="37" r="32" fill="url(#bg)"/>
        <g clip-path="url(#c)">
          <ellipse cx="37" cy="70" rx="26" ry="15" fill="#1f6b2f"/>
          <path d="M16 70Q20 58 37 56Q54 58 58 70Z" fill="#2c8a3d"/>
        </g>
        <ellipse cx="37" cy="38" rx="17" ry="16" fill="#62d03c" stroke="#3f8f24" stroke-width="1.2"/>
        <path d="M17 42Q15 12 37 12Q59 12 57 42" fill="none" stroke="#e11d48" stroke-width="3.6" stroke-linecap="round"/>
        <rect x="12" y="34" width="6.5" height="17" rx="3.2" fill="#e11d48"/>
        <rect x="55.5" y="34" width="6.5" height="17" rx="3.2" fill="#e11d48"/>
        <path d="M15 50Q16 59 28 59.5" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="30" cy="59.5" r="2.3" fill="#fff"/>
        <circle cx="30" cy="34" r="4.4" fill="#fff"/><circle cx="44" cy="34" r="4.4" fill="#fff"/>
        <g class="look">
          <circle cx="30.6" cy="34.6" r="2.3" fill="#222"/><circle cx="44.6" cy="34.6" r="2.3" fill="#222"/>
          <circle cx="31.3" cy="33.6" r=".8" fill="#fff"/><circle cx="45.3" cy="33.6" r=".8" fill="#fff"/>
        </g>
        <ellipse class="lid" cx="30" cy="34" rx="4.9" ry="4.9"/><ellipse class="lid" cx="44" cy="34" rx="4.9" ry="4.9"/>
        <circle cx="24.5" cy="43" r="3" fill="#fb923c" opacity=".55"/><circle cx="49.5" cy="43" r="3" fill="#fb923c" opacity=".55"/>
        <path class="m-smile" d="M32 44Q37 49.5 42 44" fill="none" stroke="#1d3b12" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse class="m-s" cx="37" cy="45.8" rx="2.2" ry="1.8" fill="#4a1d12"/>
        <ellipse class="m-m" cx="37" cy="46.2" rx="3.6" ry="2.8" fill="#4a1d12"/>
        <g class="m-l"><ellipse cx="37" cy="46.8" rx="4.6" ry="4" fill="#4a1d12"/><ellipse cx="37" cy="48.7" rx="2.6" ry="1.3" fill="#f472b6"/></g>
      </svg>
    </div>
  </div>
</body>
</html>
