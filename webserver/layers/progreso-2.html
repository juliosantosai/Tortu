<!--
Archivo: layers/progreso-2.html
Propósito: barra de progreso (0/100) y chapa GRACIAS del equipo 2 (CERRO).
Variable --pct en .wrap: porcentaje de avance (hoy 0%).
Debe respetar:
- usar los colores del equipo 2
- ubicarse junto al carril del equipo 2
- mostrar avance visual
- no mezclar con la barra del equipo 1
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif;
      font-weight: 900;
    }
    /* Alargue de la pista: index.html fija --ext (px de tablero) según las partes ocultas. */
    @property --ext { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --hdr { syntax: '<length>'; inherits: true; initial-value: 0px; }
    :root { transition: --ext .35s ease, --hdr .35s ease; }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board {
      position: absolute;
      left: 0;
      top: 0;
      width: 316px;
      height: 562px;
      transform: scale(3.417722);
      transform-origin: 0 0;
    }

    .wrap { position: absolute; left: 0; top: calc(0px - var(--hdr)); }
    .wrap > * { position: absolute; left: var(--x); width: 141px; box-sizing: border-box; }
    .bar {
      top: 88px; height: 15px; border: 1.5px solid #e9dcc0; border-radius: 8px; overflow: hidden;
      background: linear-gradient(180deg, #2c1a0c, #43291a); box-shadow: 0 1px 2px rgba(0,0,0,.5);
    }
    .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--pct); background: var(--fill); transition: width 1.3s cubic-bezier(.3,.7,.3,1); box-shadow: 0 0 6px rgba(255,255,255,.6); }
    .bar .fill::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.7), transparent); animation: barshine 2s linear infinite; }
    @keyframes barshine { from { left: -40%; } to { left: 100%; } }
    .bar .seg {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / 10 - 1px), rgba(230,210,170,.28) calc(100% / 10 - 1px), rgba(230,210,170,.28) calc(100% / 10));
    }
    .bar .count {
      position: absolute; left: 3px; top: 0; line-height: 12px; font-size: 9.5px; color: #fff;
      text-shadow: 0 1px 1px #000;
    }
    .honor {
      top: 114px; height: 26px; border: 1.5px solid #f2c230; border-radius: 8px;
      background: linear-gradient(180deg, #3a2208, #1b1004);
      box-shadow: inset 0 0 6px rgba(242,194,48,.25), 0 1px 2px rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center; gap: 3px;
      color: #fbd23a; font-size: 7.5px; letter-spacing: .3px;
    }
    .pray { font-size: 11px; line-height: 1; font-family: 'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif; display: inline-block; animation: pray 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
    @keyframes pray { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1px) scale(1.15); } }
  </style>
</head>
<body data-team="2">
  <div class="board">
    <div class="wrap" style="--x:167px; --pct:0%; --fill:linear-gradient(90deg,#1d4ed8,#b91c3c)">
      <div class="bar"><div class="fill"></div><div class="seg"></div><span class="count" id="count-2">0/100</span></div>
      <div class="honor"><span class="pray">🙏</span><span>GRACIAS</span></div>
    </div>
  </div>
  <script src="/layers/game-core.js"></script>
  <script src="/layers/progress-controller.js"></script>
</body>
</html>
