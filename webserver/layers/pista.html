<!--
Archivo: layers/pista.html
Propósito: base visual de los dos carriles (borde de madera, fondo oscuro, líneas
cada 5 m, marcas 0-100 m, medidor vertical) y divisor central.
Variable --p (0 a 1) en cada .lane: avance del medidor (la fija el script con el estado de la carrera).
Gamificada: bordes de neón con luz corriendo, superficie de pista que se desplaza, chevrones de
velocidad, zonas de color por tramo y medidor con brillo.
Debe respetar:
- dejar espacio para las tortugas y la meta
- ser una capa separada del fondo
- no incluir lógica de negocio (solo lee el avance para mover el medidor)
-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Arial Black', Impact, Arial, sans-serif;
      font-weight: 900;
    }
    /* Alargue de la pista: index.html fija --ext (px de tablero) según las partes ocultas. */
    @property --ext { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --hdr { syntax: '<length>'; inherits: true; initial-value: 0px; }
    @property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
    :root { transition: --ext .35s ease, --hdr .35s ease; }
    /* Tablero de diseño 316x562 (unidades) escalado al lienzo 1080x1920. */
    .board {
      position: absolute;
      left: 0;
      top: 0;
      width: 316px;
      height: 562px;
      transform: scale(3.417722);
      transform-origin: 0 0;
    }

    .lane { position: absolute; left: 0; top: 4px; width: 0; height: 0; }
    .lane > *, .gauge > * { position: absolute; }
    .bevel {
      left: var(--x); top: calc(141px - var(--ext)); width: 141px; height: calc(389px + var(--ext)); border-radius: 7px;
      background: linear-gradient(90deg, #7e5128, #c48d52 8%, #b4803f 92%, #7e5128);
      box-shadow: 0 0 0 1px #3d2410, 0 2px 4px rgba(0,0,0,.5);
    }
    .inner {
      left: calc(var(--x) + 10px); top: calc(145px - var(--ext)); width: 121px; height: calc(381px + var(--ext)); border-radius: 3px;
      background:
        repeating-linear-gradient(90deg, transparent 0 22px, rgba(255,255,255,.022) 22px 23px),
        linear-gradient(180deg, #2a190c, #3c2412 55%, #2b1a0c 85%, #21130a);
      box-shadow: inset 0 0 8px rgba(0,0,0,.75);
    }
    .grid {
      left: calc(var(--x) + 21px); top: calc(178px - var(--ext)); width: 108px; height: calc(324px + var(--ext));
      background: repeating-linear-gradient(180deg, rgba(255,235,200,.13) 0 1px, transparent 1px calc(16.15px + var(--ext) / 20));
    }
    .mj { left: calc(var(--x) + 21px); width: 108px; height: 1px; background: rgba(255,238,210,.34); }
    .lab {
      left: calc(var(--x) + 22px); font-size: 8px; line-height: 10px; letter-spacing: .5px; white-space: nowrap; font-weight: 900;
      text-shadow: 0 1px 1px #000, 0 0 3px rgba(0,0,0,.8);
    }
    .gauge {
      left: calc(var(--x) + 11px); top: calc(178px - var(--ext)); width: 7px; height: calc(323px + var(--ext)); border-radius: 4px;
      background: linear-gradient(180deg, #6a130d 0%, #5e3a0e 28%, #4c4a12 45%, #2f4a3a 62%, #173f63 80%, #12365e 100%);
      box-shadow: inset 0 0 0 .5px rgba(0,0,0,.5);
    }
    .fill {
      left: 0; right: 0; bottom: 0; height: calc(var(--p) * 100%); border-radius: 0 0 4px 4px;
      background: linear-gradient(180deg, #3aa4ff, #1b63f5);
    }
    .cap {
      left: -2px; width: 11px; height: 6px; border-radius: 50%; bottom: calc(var(--p) * 100% - 3px);
      background: radial-gradient(ellipse at 50% 40%, #fff, #bcd9ff 60%, #7fb2f5);
      box-shadow: 0 0 0 .6px #2a5aa8;
    }

    .lane.l { --neon: #cfe0ff; --neon2: #7aa2ff; }
    .lane.r { --neon: #6f98ff; --neon2: #ff4d6d; }
    .lane { transition: --p 1.3s cubic-bezier(.3,.7,.3,1); }
    .bevel { box-shadow: 0 0 0 1px #3d2410, 0 2px 4px rgba(0,0,0,.5), 0 0 7px 1px color-mix(in srgb, var(--neon) 55%, transparent); overflow: hidden; }
    /* Luz de neón que recorre el marco hacia la meta. */
    .bevel::after {
      content: ''; position: absolute; inset: 0; border-radius: 7px; pointer-events: none;
      background:
        linear-gradient(0deg, transparent 40%, var(--neon) 50%, transparent 60%) 0 0 / 2px 100% no-repeat,
        linear-gradient(0deg, transparent 40%, var(--neon) 50%, transparent 60%) 100% 0 / 2px 100% no-repeat;
      background-size: 2px 60px, 2px 60px; background-repeat: repeat-y; opacity: .8;
      animation: runlight 2.2s linear infinite;
    }
    @keyframes runlight { from { background-position: 0 60px, 100% 60px; } to { background-position: 0 0, 100% 0; } }
    /* Tramos de color: de salida (azul) a meta (rojo). */
    .zones {
      left: calc(var(--x) + 19px); top: calc(178px - var(--ext)); width: 112px; height: calc(323px + var(--ext));
      background: linear-gradient(0deg, rgba(34,120,255,.16), rgba(34,211,238,.10) 28%, rgba(250,204,21,.09) 52%, rgba(251,146,60,.12) 76%, rgba(239,68,68,.20));
    }
    /* Superficie que se desplaza hacia abajo: da sensación de avance. */
    .flow {
      left: calc(var(--x) + 19px); top: calc(145px - var(--ext)); width: 112px; height: calc(381px + var(--ext)); overflow: hidden; opacity: .55;
      background:
        repeating-linear-gradient(180deg, rgba(255,240,210,.20) 0 7px, transparent 7px 19px) 37px 0 / 1.5px 100% repeat-y,
        repeating-linear-gradient(180deg, rgba(255,240,210,.20) 0 7px, transparent 7px 19px) 74px 0 / 1.5px 100% repeat-y;
      animation: roll 1.1s linear infinite;
    }
    @keyframes roll { from { background-position-y: 0, 0; } to { background-position-y: 19px, 19px; } }
    /* Chevrones de velocidad que suben por los costados. */
    .chev { left: calc(var(--x) + 22px); top: calc(150px - var(--ext)); width: 106px; height: calc(371px + var(--ext)); overflow: hidden; opacity: .5; }
    .chev::before, .chev::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 8px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='24' viewBox='0 0 8 24'><path d='M1 14 4 10 7 14' fill='none' stroke='%23ffe9b0' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round' opacity='.65'/></svg>") 0 0 / 8px 24px repeat-y;
      animation: up 1.3s linear infinite;
    }
    .chev::before { left: 3px; } .chev::after { right: 3px; animation-delay: -.65s; }
    @keyframes up { from { background-position-y: 24px; } to { background-position-y: 0; } }
    .fill { background: linear-gradient(180deg, #8fd0ff, #3aa4ff 40%, #1b63f5); box-shadow: 0 0 6px rgba(58,164,255,.9); overflow: hidden; }
    .fill::after { content: ''; position: absolute; left: 0; right: 0; height: 40%; background: linear-gradient(180deg, transparent, rgba(255,255,255,.65), transparent); animation: gaugeflow 1.4s linear infinite; }
    @keyframes gaugeflow { from { bottom: -40%; } to { bottom: 110%; } }
    .cap { box-shadow: 0 0 0 .6px #2a5aa8, 0 0 7px 2px rgba(143,208,255,.95); animation: capglow 1.2s ease-in-out infinite; }
    @keyframes capglow { 50% { box-shadow: 0 0 0 .6px #2a5aa8, 0 0 11px 4px rgba(255,255,255,.95); } }
    .lab { font-style: italic; -webkit-text-stroke: .25px rgba(0,0,0,.6); }
    .divider .d-blue { animation: divpulse 2s ease-in-out infinite; }
    @keyframes divpulse { 50% { filter: brightness(1.6) drop-shadow(0 0 3px #6f98ff); } }
    /* Con un escenario de fondo activo, la pista pasa a "cristal" para dejar ver el paisaje. */
    body[data-scene]:not([data-scene="0"]) .bevel {
      background: linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 50%, rgba(255,255,255,.16));
      box-shadow: 0 0 0 1.5px var(--neon), 0 0 10px 2px color-mix(in srgb, var(--neon) 60%, transparent), inset 0 0 8px rgba(255,255,255,.25);
    }
    body[data-scene]:not([data-scene="0"]) .inner {
      background: repeating-linear-gradient(90deg, transparent 0 22px, rgba(255,255,255,.03) 22px 23px), linear-gradient(180deg, rgba(8,6,16,.16), rgba(8,6,16,.38));
      box-shadow: inset 0 0 10px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.18);
    }
    .bevel, .inner { transition: background .6s, box-shadow .6s; }
    @media (prefers-reduced-motion: reduce) { .bevel::after, .flow, .chev::before, .chev::after, .fill::after, .cap, .divider .d-blue { animation: none; } }
    .divider { position: absolute; left: 153px; top: 66px; width: 10px; height: 496px; }
    .divider i { position: absolute; top: 0; bottom: 0; }
    .d-line { left: 0; width: 1.2px; background: #f1e6cc; }
    .d-wood { left: 1.8px; width: 5.4px; background: repeating-linear-gradient(180deg, #b8824a 0 2px, #7a4f27 2px 3px); }
    .d-blue { left: 7.6px; width: 2.4px; background: linear-gradient(90deg, #4f86f0, #2a58c9); }
  </style>
</head>
<body>
  <div class="board">
    <div class="lane l" style="--x:8px; --p:0">
      <div class="bevel"></div>
      <div class="inner"></div>
      <i class="zones"></i><i class="flow"></i><i class="chev"></i>
      <div class="grid"></div>
      <i class="mj" style="top:calc(178px - var(--ext))"></i>
      <i class="mj" style="top:calc(258.75px - var(--ext) * 0.75)"></i>
      <i class="mj" style="top:calc(339.5px - var(--ext) * 0.5)"></i>
      <i class="mj" style="top:calc(420.25px - var(--ext) * 0.25)"></i>
      <i class="mj" style="top:501px"></i>
      <span class="lab" style="top:calc(181px - var(--ext));color:#ef5350">100 m</span>
      <span class="lab" style="top:calc(253.75px - var(--ext) * 0.75);color:#fb923c">75 m</span>
      <span class="lab" style="top:calc(334.5px - var(--ext) * 0.5);color:#fbbf24">50 m</span>
      <span class="lab" style="top:calc(415.25px - var(--ext) * 0.25);color:#5fd3e8">25 m</span>
      <span class="lab" style="top:496px;color:#4aa3ff">0 m</span>
      <div class="gauge"><div class="fill"></div><div class="cap"></div></div>
    </div>
    <div class="lane r" style="--x:167px; --p:0">
      <div class="bevel"></div>
      <div class="inner"></div>
      <i class="zones"></i><i class="flow"></i><i class="chev"></i>
      <div class="grid"></div>
      <i class="mj" style="top:calc(178px - var(--ext))"></i>
      <i class="mj" style="top:calc(258.75px - var(--ext) * 0.75)"></i>
      <i class="mj" style="top:calc(339.5px - var(--ext) * 0.5)"></i>
      <i class="mj" style="top:calc(420.25px - var(--ext) * 0.25)"></i>
      <i class="mj" style="top:501px"></i>
      <span class="lab" style="top:calc(181px - var(--ext));color:#ef5350">100 m</span>
      <span class="lab" style="top:calc(253.75px - var(--ext) * 0.75);color:#fb923c">75 m</span>
      <span class="lab" style="top:calc(334.5px - var(--ext) * 0.5);color:#fbbf24">50 m</span>
      <span class="lab" style="top:calc(415.25px - var(--ext) * 0.25);color:#5fd3e8">25 m</span>
      <span class="lab" style="top:496px;color:#4aa3ff">0 m</span>
      <div class="gauge"><div class="fill"></div><div class="cap"></div></div>
    </div>
    <div class="divider"><i class="d-line"></i><i class="d-wood"></i><i class="d-blue"></i></div>
  </div>
  <script src="/layers/game-core.js"></script>
  <script>
    (function () {
      var lanes = document.querySelectorAll('.lane');
      TortuGame.onScene(function (n) { document.body.setAttribute('data-scene', String(n)); });
      TortuGame.onState(function (st) {
        lanes.forEach(function (lane, i) { lane.style.setProperty('--p', st.teams[i].p); });
      });
    })();
  </script>
</body>
</html>
